<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ashes of Tomorrow — Post-Apocalyptic Survival</title>
<style>
  :root{
    --bg:#0d0f10; --bg2:#15191c; --bg3:#1e2428;
    --line:#2b333a; --line2:#3a444c;
    --text:#d5dde2; --muted:#8d99a3; --dim:#5e6a73;
    --accent:#c9a14a; --accent2:#a07a30;
    --good:#7fbf5d; --warn:#e2b14b; --bad:#d35353; --info:#5fa8d3;
    --night:#0a0d18;
    --card:#171b1f;
    --hp:#d35353; --hunger:#b07a39; --thirst:#5fa8d3; --energy:#c9a14a;
    --happy:#cf6cb0; --safety:#7fbf5d; --morale:#e2b14b; --warm:#d97a3a; --xp:#9b7bdc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.35}
  body.night{background:var(--night)}
  a{color:var(--info)}
  button{font-family:inherit;background:var(--bg3);color:var(--text);border:1px solid var(--line2);padding:5px 10px;cursor:pointer;border-radius:3px}
  button:hover:not(:disabled){background:#252d33;border-color:var(--accent2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#3a2e15;border-color:var(--accent2);color:var(--accent)}
  button.primary:hover:not(:disabled){background:#4a3a1c}
  button.danger{background:#3a1a1a;border-color:#7a3232;color:#ffb0b0}
  button.danger:hover:not(:disabled){background:#5a2424}
  button.small{padding:2px 6px;font-size:11px}
  select{background:var(--bg3);color:var(--text);border:1px solid var(--line2);padding:3px 6px;font-family:inherit;font-size:12px;border-radius:3px;margin-top:4px;width:100%}
  select:focus{outline:none;border-color:var(--accent)}
  option{background:var(--bg3);color:var(--text)}
  option:disabled{color:var(--dim)}
  .hidden{display:none!important}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px}
  .grow{flex:1}
  .muted{color:var(--muted)}
  .dim{color:var(--dim)}
  .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .info{color:var(--info)}

  /* Layout */
  #app{display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;color:var(--accent);letter-spacing:1px}
  header .topstats{display:flex;gap:14px;flex-wrap:wrap;flex:1;justify-content:center;font-size:12px}
  header .topstats span b{color:var(--accent)}
  header .ctrls{display:flex;gap:6px}

  main{display:grid;grid-template-columns:280px 1fr 300px;overflow:hidden}
  .panel{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  .panel.right{border-right:none;border-left:1px solid var(--line)}
  .center{overflow-y:auto;padding:10px;background:var(--bg)}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px}
  .card h3{margin:0 0 6px 0;font-size:13px;color:var(--accent);letter-spacing:.5px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .card h4{margin:6px 0 4px 0;font-size:12px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

  /* Bars */
  .bar{position:relative;background:#0a0e10;border:1px solid var(--line);height:14px;border-radius:2px;overflow:hidden;margin:2px 0}
  .bar > .fill{height:100%;transition:width .25s}
  .bar > .lbl{position:absolute;left:6px;top:0;font-size:11px;line-height:14px;color:#fff;text-shadow:0 0 2px #000;white-space:nowrap}
  .bar > .val{position:absolute;right:6px;top:0;font-size:11px;line-height:14px;color:#fff;text-shadow:0 0 2px #000}

  /* Tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:8px;flex-wrap:wrap}
  .tabs button{border-bottom:none;border-radius:3px 3px 0 0;background:var(--bg2);font-size:12px}
  .tabs button.active{background:var(--card);color:var(--accent);border-color:var(--accent2)}

  /* Resources list */
  .reslist{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12px}
  .reslist .ri{display:flex;justify-content:space-between;border-bottom:1px dotted #222;padding:1px 0}
  .reslist .ri .nm{color:var(--muted)}
  .reslist .ri .vl{color:var(--text)}
  .reslist .ri .vl.full{color:var(--warn)}

  /* Log */
  .log{font-size:12px;max-height:100%;overflow-y:auto}
  .log .e{padding:3px 4px;border-bottom:1px dotted #1f2429}
  .log .e .t{color:var(--dim);margin-right:6px;font-size:10px}
  .log .e.good{background:rgba(127,191,93,.05)}
  .log .e.bad{background:rgba(211,83,83,.07)}
  .log .e.warn{background:rgba(226,177,75,.06)}
  .log .e.info{background:rgba(95,168,211,.05)}

  /* Lists */
  .item{background:#11161a;border:1px solid var(--line);border-radius:3px;padding:6px;margin-bottom:6px}
  .item .name{font-weight:bold;color:var(--text)}
  .item .desc{font-size:11px;color:var(--muted);margin:2px 0}
  .item .cost{font-size:11px;color:var(--warn)}
  .item .effect{font-size:11px;color:var(--good)}
  .item .meta{font-size:11px;color:var(--info)}

  /* Survivor card */
  .surv{background:#11161a;border:1px solid var(--line);border-radius:3px;padding:6px;margin-bottom:6px}
  .surv .head{display:flex;justify-content:space-between;align-items:center}
  .surv .traits{font-size:11px;color:var(--info);margin-top:3px}
  .surv .bars{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;margin-top:4px}

  /* Knowledge */
  .kcat{margin-bottom:10px}
  .kcat h4{color:var(--accent);font-size:12px;margin:0 0 4px 0}
  .knode{display:inline-block;background:#11161a;border:1px solid var(--line);padding:4px 6px;margin:2px;border-radius:3px;cursor:pointer;font-size:11px}
  .knode.unlocked{border-color:var(--good);color:var(--good)}
  .knode.available{border-color:var(--accent);color:var(--accent)}
  .knode.locked{opacity:.5}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000}
  .modal{background:var(--bg2);border:1px solid var(--accent2);border-radius:6px;padding:14px;max-width:520px;width:90%;max-height:80vh;overflow-y:auto}
  .modal h2{margin:0 0 8px 0;color:var(--accent);font-size:15px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  /* Sage chat modal */
  .sage-modal{max-width:640px}
  .sage-history{background:#0c1115;border:1px solid var(--line);border-radius:3px;padding:8px;height:300px;overflow-y:auto;font-size:12px;display:flex;flex-direction:column;gap:6px}
  .sage-line{white-space:pre-wrap;word-wrap:break-word}
  .sage-line b{color:var(--accent)}
  .sage-user{color:var(--text)}
  .sage-user b{color:var(--info)}
  .sage-assistant{color:#cdd6db}
  .sage-status{margin:6px 0;font-size:11px;min-height:14px}
  .sage-status.deep{color:var(--accent);font-weight:bold;animation:pulseText .8s ease-in-out infinite alternate}
  .sage-modal.deep-thinking{box-shadow:0 0 0 2px rgba(201,161,74,.35),0 0 28px rgba(201,161,74,.28)}
  .sage-modal.deep-thinking h2::after{content:" — THINKING DEEPER";color:var(--accent);font-size:11px;letter-spacing:1px;animation:pulseText .8s ease-in-out infinite alternate}
  @keyframes pulseText{from{opacity:.55}to{opacity:1}}
  .sage-input{width:100%;background:#0c1115;color:var(--text);border:1px solid var(--line2);border-radius:3px;padding:6px;font-family:inherit;font-size:12px;resize:vertical}
  .sage-input:focus{outline:none;border-color:var(--accent)}

  /* Action group */
  .actgrp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .actgrp button{text-align:left;padding:8px}
  .actgrp button .sub{display:block;font-size:10px;color:var(--muted);margin-top:2px}

  /* Misc */
  .danger-level{padding:2px 6px;border-radius:3px;font-size:11px;background:#2a1a1a;color:#ff9b9b;display:inline-block}
  .badge{display:inline-block;background:#222;color:var(--text);padding:1px 5px;border-radius:8px;font-size:10px;margin-right:3px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#0a0d10}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#555}

  /* Map system */
  .map-wrap{display:flex;flex-direction:column;gap:8px}
  .map-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-size:11px}
  .map-controls .legend{color:var(--muted)}
  .followers-strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11px;background:var(--card);padding:6px;border:1px solid var(--line);border-radius:4px}
  .followers-strip .ftag{background:#2d2418;color:var(--accent);padding:2px 6px;border-radius:8px;border:1px solid var(--accent2)}
  .map-grid{display:grid;background:#000;border:1px solid var(--line2);gap:0;user-select:none;width:max-content;margin:0 auto}
  .tile{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;position:relative;font-family:Consolas,monospace;line-height:1;overflow:hidden}
  .tile.unseen{background:#04060a!important}
  .tile.fog{filter:brightness(0.45) saturate(0.4)}
  .tile.player-tile{box-shadow:inset 0 0 0 2px var(--accent)}
  .tile.village-tile{box-shadow:inset 0 0 0 2px #ff8800}
  .tile .biome{opacity:.55}
  .tile .feat{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;text-shadow:0 0 2px #000}
  .tile .ent{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;text-shadow:0 0 2px #000}
  .tile .pl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;text-shadow:0 0 3px #000,0 0 6px #ffaa44;z-index:2}
  .tile .fol{position:absolute;bottom:-2px;right:-2px;font-size:9px;background:#000;color:var(--accent);border-radius:2px;padding:0 2px;z-index:3}
  .tile.hostile-adj{box-shadow:inset 0 0 0 1px var(--bad)}
  .tile.friendly-adj{box-shadow:inset 0 0 0 1px var(--good)}
  .tile:hover{outline:1px solid var(--accent);z-index:1}
  .mini{display:grid;gap:0;background:#000;border:1px solid var(--line);padding:1px}
  .mt{width:3px;height:3px}
  .biome-key{display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
  .biome-key span{display:inline-flex;align-items:center;gap:2px}
  .biome-key i{display:inline-block;width:10px;height:10px;border-radius:2px}
  .dialog-options{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .dialog-options button{text-align:left;padding:6px 8px}

  /* Settlement strategy grid */
  .town-wrap{display:flex;flex-direction:column;gap:8px}
  .town-controls{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:12px}
  .town-grid{display:grid;grid-template-columns:repeat(14,42px);grid-template-rows:repeat(9,42px);gap:2px;background:#07090a;border:1px solid var(--line2);padding:4px;width:max-content;max-width:100%;overflow:auto}
  .town-tile{width:42px;height:42px;background:#11171b;border:1px solid #202a30;border-radius:3px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;font-size:21px}
  .town-tile.empty:hover{border-color:var(--accent);background:#182025}
  .town-tile.occupied{background:#1a1f18;border-color:#39442f}
  .town-tile.wall{background:#211c14;border-color:#6a4a20}
  .town-tile.center{box-shadow:inset 0 0 0 2px var(--accent)}
  .town-tile .count{position:absolute;right:2px;bottom:1px;background:#000;color:var(--accent);font-size:10px;border-radius:2px;padding:0 2px}
  .town-selected{color:var(--accent);font-weight:bold}

  @media(max-width:1100px){
    main{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto;height:auto}
    .panel{max-height:50vh;border-right:none;border-bottom:1px solid var(--line)}
    .panel.right{border-left:none}
  }

  /* Claude hint bubble */
  #claude-hint{position:fixed;left:14px;bottom:14px;z-index:900;display:flex;align-items:flex-end;gap:8px;max-width:380px;animation:hintIn .35s ease-out}
  #claude-hint.hidden{display:none}
  #claude-hint .hint-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#3a2e15,#5a4a20);border:2px solid var(--accent2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:0 0 12px rgba(201,161,74,.4);animation:think 2.2s ease-in-out infinite}
  #claude-hint .hint-bubble{position:relative;background:var(--bg2);border:1px solid var(--accent2);border-radius:10px;padding:10px 30px 10px 12px;font-size:12px;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.6)}
  #claude-hint .hint-bubble::before{content:"";position:absolute;left:-8px;bottom:14px;width:0;height:0;border-style:solid;border-width:6px 8px 6px 0;border-color:transparent var(--accent2) transparent transparent}
  #claude-hint .hint-bubble .hint-label{color:var(--accent);font-weight:bold;font-size:10px;letter-spacing:1px;display:block;margin-bottom:3px;text-transform:uppercase}
  #claude-hint .hint-bubble .hint-text{line-height:1.45}
  #claude-hint .hint-bubble .hint-close{position:absolute;top:4px;right:6px;background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0;line-height:1;width:18px;height:18px}
  #claude-hint .hint-bubble .hint-close:hover{color:var(--bad);background:transparent;border:none}
  @keyframes hintIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes think{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  /* Guide tab */
  .guide-section{margin-bottom:14px}
  .guide-section h3{color:var(--accent);font-size:14px;border-bottom:1px solid var(--line);padding-bottom:4px;margin:0 0 6px 0}
  .guide-section h4{color:var(--info);font-size:12px;margin:8px 0 3px 0}
  .guide-section p{margin:4px 0;font-size:12px;line-height:1.5}
  .guide-section ul{margin:4px 0;padding-left:18px;font-size:12px;line-height:1.55}
  .guide-section li{margin-bottom:2px}
  .guide-section kbd{background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:1px 5px;font-family:inherit;font-size:11px;color:var(--accent)}
  .guide-toc{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
  .guide-toc a{background:var(--bg3);border:1px solid var(--line);padding:3px 8px;border-radius:3px;font-size:11px;text-decoration:none;color:var(--muted)}
  .guide-toc a:hover{color:var(--accent);border-color:var(--accent2)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ASHES OF TOMORROW</h1>
    <div class="topstats">
      <span>Day <b id="hud-day">1</b></span>
      <span id="hud-phase">Morning</span>
      <span>Pop: <b id="hud-pop">1</b></span>
      <span>Danger: <b id="hud-danger">0</b></span>
      <span>Rep: <b id="hud-rep">0</b></span>
      <span>Knowledge: <b id="hud-know">0</b></span>
    </div>
    <div class="ctrls">
      <button id="btn-rest" title="Sleep until next morning">Sleep</button>
      <button id="btn-rt" class="small" title="Toggle real-time ticking">Paused</button>
      <button id="btn-speed" class="small" title="Change real-time speed">1x</button>
      <button id="btn-save" class="small">Save</button>
      <button id="btn-load" class="small">Load</button>
      <button id="btn-reset" class="small danger">Reset</button>
      <button id="btn-help" class="small">?</button>
    </div>
  </header>
  <main>
    <aside class="panel" id="left-panel">
      <!-- Character + settlement summary -->
    </aside>
    <section class="center" id="center-panel">
      <div class="tabs" id="tabs"></div>
      <div id="tab-content"></div>
    </section>
    <aside class="panel right" id="right-panel">
      <!-- Event log + resources -->
    </aside>
  </main>
</div>
<div id="modal-root"></div>

<script>
"use strict";

/* ============================================================
   ASHES OF TOMORROW
   A single-file post-apocalyptic survival prototype
   ============================================================ */

// ------------------------- DATA ------------------------------

const RESOURCES = {
  wood:        {name:"Wood",         icon:"🪵"},
  planks:      {name:"Planks",       icon:"🟫"},
  stone:       {name:"Stone",        icon:"🪨"},
  bricks:      {name:"Bricks",       icon:"🧱"},
  clay:        {name:"Clay",         icon:"🟤"},
  metal:       {name:"Metal Scraps", icon:"🔩"},
  iron:        {name:"Iron",         icon:"⛓"},
  steel:       {name:"Steel",        icon:"⚙"},
  nails:       {name:"Nails",        icon:"📌"},
  tools:       {name:"Tools",        icon:"🛠"},
  rope:        {name:"Rope",         icon:"🪢"},
  cloth:       {name:"Cloth",        icon:"🧵"},
  leather:     {name:"Leather",      icon:"🟫"},
  hides:       {name:"Hides",        icon:"🦌"},
  bones:       {name:"Bones",        icon:"🦴"},
  food:        {name:"Food",         icon:"🍞"},
  meat:        {name:"Meat",         icon:"🍖"},
  crops:       {name:"Crops",        icon:"🌾"},
  seeds:       {name:"Seeds",        icon:"🌱"},
  herbs:       {name:"Herbs",        icon:"🌿"},
  water:       {name:"Clean Water",  icon:"💧"},
  dirty_water: {name:"Dirty Water",  icon:"💧"},
  medicine:    {name:"Medicine",     icon:"💊"},
  alcohol:     {name:"Alcohol",      icon:"🍺"},
  charcoal:    {name:"Charcoal",     icon:"⬛"},
  fuel:        {name:"Fuel",         icon:"⛽"},
  oil:         {name:"Oil",          icon:"🛢"},
  parts:       {name:"Parts",        icon:"🔧"},
  components:  {name:"Components",   icon:"🔌"},
  batteries:   {name:"Batteries",    icon:"🔋"},
  glass:       {name:"Glass",        icon:"🪟"},
  weapons:     {name:"Weapons",      icon:"🗡"},
  ammo:        {name:"Ammunition",   icon:"📦"},
  books:       {name:"Books",        icon:"📖"},
};

const RES_KEYS = Object.keys(RESOURCES);

const NEED_DEFS = {
  health:    {label:"Health",    color:"var(--hp)"},
  hunger:    {label:"Hunger",    color:"var(--hunger)"},
  thirst:    {label:"Thirst",    color:"var(--thirst)"},
  energy:    {label:"Energy",    color:"var(--energy)"},
  happiness: {label:"Happiness", color:"var(--happy)"},
  safety:    {label:"Safety",    color:"var(--safety)"},
  morale:    {label:"Morale",    color:"var(--morale)"},
  warmth:    {label:"Warmth",    color:"var(--warm)"},
};

// Locations
const LOCATIONS = {
  forest:        {name:"Forest",            icon:"🌲", danger:1,  time:2, energy:8,  loot:{wood:[2,5], herbs:[0,2], seeds:[0,1], bones:[0,1]}, survChance:.04, foundEnemies:["wild_dogs","wolves","forest_beasts"]},
  road:          {name:"Abandoned Road",    icon:"🛣", danger:1,  time:2, energy:7,  loot:{metal:[1,3], cloth:[0,2], parts:[0,1], fuel:[0,1]}, survChance:.06, foundEnemies:["scavengers","thieves","desperate"]},
  ruined_house:  {name:"Ruined House",      icon:"🏚", danger:2,  time:2, energy:10, loot:{wood:[1,3], cloth:[1,3], food:[0,2], tools:[0,1], books:[0,1]}, survChance:.08, foundEnemies:["infected","scavengers","thieves"]},
  market:        {name:"Old Market",        icon:"🛒", danger:2,  time:3, energy:12, loot:{food:[1,4], cloth:[1,3], medicine:[0,1], alcohol:[0,1], glass:[0,2]}, survChance:.08, foundEnemies:["scavengers","raiders","desperate"]},
  police:        {name:"Police Station",    icon:"🚓", danger:3,  time:3, energy:14, loot:{weapons:[0,1], ammo:[0,3], metal:[1,3], books:[0,1]}, survChance:.06, foundEnemies:["infected","raiders","bandits"]},
  hospital:      {name:"Hospital Ruins",    icon:"🏥", danger:3,  time:3, energy:14, loot:{medicine:[1,3], herbs:[0,2], cloth:[1,3], books:[0,1]}, survChance:.08, foundEnemies:["infected","cultists","desperate"]},

function newGame(){
  const g = {
    day:1, phase:0,
    log:[],
    knowledge:0, reputation:0, danger:0,
    autoNotice:true,
    knownNodes:{}, // unlocked knowledge nodes
    resources: Object.fromEntries(RES_KEYS.map(k=>[k,0])),

    survivors: [], // includes the player at index 0
    jobs: {}, // survivorId -> jobKey

    nextSurvId: 1,
    relationships: [], // {a,b,type:'partner'|'child'|'parent'}
    eventCooldowns: {},
    seed: Math.floor(Math.random()*1e9),
    // map state
    map: null,
    playerX: 0, playerY: 0,
    villageX: 0, villageY: 0,
    explored: {}, // "x,y" -> true
    followers: [],
    stepAccum: 0,
    town: null,
  };
  // Player
  const player = makeSurvivor("Survivor", true);
  player.firstName = "You";

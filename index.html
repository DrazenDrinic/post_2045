function describeEffects(b){
  const eff = b.effects || {};
  const parts = [];
  if (eff.housing) parts.push("+"+eff.housing+" housing");
  if (eff.storage) parts.push("+"+eff.storage+" storage");
  if (eff.food_storage) parts.push("+"+eff.food_storage+" food storage");
  if (eff.warmth) parts.push("warmth");
  if (eff.produce) parts.push(Object.entries(eff.produce).map(([k,v])=>"+"+v+" "+RESOURCES[k].name+"/day").join(", "));
  if (eff.produce_per_worker) parts.push(Object.entries(eff.produce_per_worker).map(([k,v])=>"+"+v+" "+RESOURCES[k].name+"/worker/day").join(", "));
  if (eff.convert) parts.push("converts "+Object.entries(eff.convert.from).map(([k,v])=>v+" "+RESOURCES[k].name).join("+")+" → "+Object.entries(eff.convert.to).map(([k,v])=>v+" "+RESOURCES[k].name).join("+")+" /worker");
  if (eff.knowledge_per_worker) parts.push("+"+eff.knowledge_per_worker+" knowledge/worker/day");
  if (eff.heal_per_worker) parts.push("heals "+eff.heal_per_worker+"/worker/day");
  if (eff.happiness_all) parts.push("+"+eff.happiness_all+" happiness aura");
  if (eff.morale_all) parts.push("+"+eff.morale_all+" morale aura");
  if (eff.safety_per_worker) parts.push("+"+eff.safety_per_worker+" safety/worker");
  if (eff.wall) parts.push("+"+eff.wall+" wall");
  if (eff.warning) parts.push("early warning");
  if (eff.danger_reduce) parts.push("-"+eff.danger_reduce+" danger");
  if (eff.attract_chance) parts.push("attracts newcomers");
  if (eff.trade_chance) parts.push("attracts traders");
  if (eff.reputation) parts.push("+reputation");
  return parts.join(" • ");
}

// ------------------------- HINT SYSTEM ------------------------------
// "Thinking Claude" — pops up when the player has been idle and stuck.
// Kept entirely in module-level state, NOT in G.

let _hintTimeout = null;
const HINT_DELAY_MS = 10000;
let _hintLast = "";

function scheduleHint(){
  if (_hintTimeout) clearTimeout(_hintTimeout);
  hideHint();
  _hintTimeout = setTimeout(showHint, HINT_DELAY_MS);
}

function hideHint(){
  const h = document.getElementById("claude-hint");
  if (h) h.classList.add("hidden");
}

function showHint(){
  if (!G) return;
  // Don't show during combat or other modals
  if (document.getElementById("modal-root").firstChild) {
    _hintTimeout = setTimeout(showHint, HINT_DELAY_MS);
    return;
  }
  const text = detectHint(G);
  if (!text) return;
  _hintLast = text;
  let h = document.getElementById("claude-hint");
  if (!h){
    h = document.createElement("div");
    h.id = "claude-hint";
    document.body.appendChild(h);
  }
  h.classList.remove("hidden");
  h.innerHTML = `<div class="hint-avatar" title="Thinking…">🤔</div>
    <div class="hint-bubble">
      <button class="hint-close" title="Dismiss">×</button>
      <span class="hint-label">Claude is thinking…</span>
      <div class="hint-text">${text}</div>
    </div>`;
  h.querySelector(".hint-close").onclick = ()=>{
    hideHint();
    // wait longer before nagging again
    if (_hintTimeout) clearTimeout(_hintTimeout);
    _hintTimeout = setTimeout(showHint, HINT_DELAY_MS * 3);
  };
}

function detectHint(g){
  const p = g.survivors[0];
  if (!p || p.health <= 0) return null;

  // Critical needs first
  if (p.energy < 15) return "I'm exhausted — I should <b>Sleep</b> (top-right button) or use the <b>💤 Rest</b> action. Walking with empty energy will get me stuck.";
  if (p.thirst < 20){
    if (g.resources.water >= 1) return "I'm parched. I have clean water — hit the <b>💧 Drink</b> action in the left panel.";
    if (g.resources.dirty_water >= 2 && g.resources.wood >= 1) return "I'm parched. Use <b>🔥 Boil Water</b> to turn dirty water into safe water, then drink.";
    return "I'm parched and there's no water at camp. I should find a <b>spring (💧), pond, stream</b>, or the river on the map — then bring it back and boil it.";
  }
  if (p.hunger < 20){
    if (g.resources.food >= 1) return "Starving — hit <b>🍞 Eat</b> in Quick Actions.";
    if (g.resources.meat >= 1 || g.resources.crops >= 2) return "Starving. I have ingredients — use <b>🍳 Cook</b> to make food, then eat.";
    return "Starving and the larder is empty. I should <b>🌿 Forage</b>, hunt a deer carcass, or walk to a berry bush on the map.";
  }
  if (p.health < 30) return "I'm hurt badly. Get back to camp, rest, and find medicine. Hot springs (♨) on the map also heal.";
  if (p.diseased){
    if (g.resources.medicine >= 1) return "I'm sick — the day-end will use a medicine to cure me. Sit tight, or build a Clinic / Herbalist for ongoing care.";
    return "I'm <b>diseased</b>. I need medicine — search hospitals, medicine cabinets, or research <b>Herbalism</b> to brew it from herbs.";
  }
  if (p.warmth < 25){
    if (g.phase === 3) return "I'm freezing at night. Get next to the 🔥 campfire — adjacent tiles share warmth. Or find a hot spring.";
    return "I'm cold. Head back toward camp and the campfire, or find shelter.";
  }

  // Resource shortages
  if (g.resources.wood < 2) return "Wood is almost gone — without it I can't boil water or keep the fire going. <b>🪓 Chop Wood</b>, or find a dead tree / fallen log on the map.";
  if (g.resources.water < 1 && g.resources.dirty_water < 1) return "No water at all in storage. Find a water source on the map (springs and wells are best) before thirst becomes critical.";
  if (g.resources.food < 2) return "Food is running low. Forage, hunt, cook meat/crops, or build a Garden once Farming is researched.";

  // Settlement / progression
  const housing = getHousing(g);
  if (housing <= g.survivors.length) return `Housing is full (${g.survivors.length}/${housing}). New recruits and babies need a roof — build a tent or shelter from the <b>🏗 Build</b> tab.`;

  if (g.survivors.length < 2 && g.day >= 2) return "Still alone. Explore the world map looking for friendly NPCs (🚶 wanderers, 🧒 children, 🩺 doctors). Walk into them to talk.";

  // Idle workers
  let workersFree = 0;
  for (const s of g.survivors){
    if (s.isPlayer || s.isChild || s.health <= 0) continue;
    const j = g.jobs[s.id];
    if (!j || j === "none") workersFree++;
  }
  if (workersFree > 0) return `${workersFree} survivor${workersFree>1?'s are':' is'} idle. Open the <b>🛠 Jobs</b> tab and assign them — they'll bring back wood, water, food, or work in buildings.`;

  // Knowledge available
  if (g.knowledge >= 5){
    const ready = KNOWLEDGE.filter(n => !g.knownNodes[n.id] && n.req.every(r=>g.knownNodes[r]) && g.knowledge >= n.cost);
    if (ready.length) return `I have <b>${Math.floor(g.knowledge)} knowledge</b> and ${ready.length} research${ready.length>1?'es':''} I can buy (e.g. <b>${ready[0].name}</b>). Open the <b>📚 Knowledge</b> tab.`;
  }

  // Danger creeping up
  const dng = settlementDanger(g);
  if (dng > 20){
    let walls = 0;
    for (const id in g.buildings){
      const b = BUILDINGS[id];
      if (b?.effects?.wall) walls += b.effects.wall * g.buildings[id].count;
    }
    if (walls < 20) return `Danger is at <b>${dng}</b> and defenses are thin. Research <b>Defense</b> / <b>Fortifications</b>, then build palisades, guard posts and watchtowers before the next raid.`;
  }

  // Player at full energy with nothing pressing — encourage exploration
  if (p.energy > 70 && p.hunger > 60 && p.thirst > 60){
    const generic = [
      "All my needs are met — good time to push out into the map. New tiles often have ruins, caches, or NPCs.",
      "Calm moment. I could spend it researching new knowledge or building something from the Build tab.",
      "Solid state. If I have books, <b>📚 Study</b> is a fast way to earn knowledge.",
      "Maybe scout deeper into the map — library ruins and hidden caches give big rewards.",
    ];
    // avoid repeating last hint
    const filtered = generic.filter(g=>g!==_hintLast);
    return filtered[Math.floor(Math.random()*filtered.length)];
  }

  return null;
}

function render(){
  renderHeader();
  renderLeft();
  renderRight();
  renderTabs();
  renderContent();
  scheduleHint();
}

function setRealtimeSpeed(speed){
  _rtSpeed = clamp(speed, 0, 3);
  if (_rtTimer) clearInterval(_rtTimer);
  _rtTimer = null;
  if (_rtSpeed > 0){
    _rtTimer = setInterval(realtimeTick, REALTIME_MS[_rtSpeed]);
  }
  renderHeader();
}

function realtimeTick(){
  if (!G || document.getElementById("modal-root").firstChild) return;
  if (G.survivors[0]?.health <= 0) return;
  advanceOnePhase(G);
  pushLog(G, "Time passes...", "dim");
  render(); save();
}

function toggleRealtime(){
  setRealtimeSpeed(_rtSpeed ? 0 : 1);
}

function cycleRealtimeSpeed(){
  const next = _rtSpeed === 0 ? 1 : (_rtSpeed % 3) + 1;
  setRealtimeSpeed(next);
}

// The Old Sage is a local, rule-based advisor. No runtime network calls.
// Per-session conversation memory. Not saved to localStorage on purpose.
let _sageHistory = [];
let _sageBusy = false;
let _sageThinkTimer = null;

function openSageChat(g){
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  const bg = el("div","modal-bg");
  const m = el("div","modal sage-modal");
  m.innerHTML = `
    <h2>🧓 The Old Sage</h2>
    <div class="body">
      <div id="sage-history" class="sage-history"></div>
      <div id="sage-status" class="sage-status muted">Ask the sage anything about your journey.</div>
      <textarea id="sage-input" class="sage-input" rows="2" placeholder="Speak, traveler... (Enter to send, Shift+Enter for newline)"></textarea>
    </div>
  `;
  const acts = el("div","actions");
  const clearBtn = el("button","","Clear chat");
  clearBtn.onclick = ()=>{ _sageHistory = []; renderSageHistory(); };
  const sendBtn = el("button","primary","Ask");
  sendBtn.id = "sage-send";
  sendBtn.onclick = ()=>sendSageMessage();
  const deepBtn = el("button","primary","Think Deeper");
  deepBtn.id = "sage-deep";
  deepBtn.onclick = ()=>beginSageDeepThink();
  const leaveBtn = el("button","","Leave");
  leaveBtn.onclick = ()=>{ closeModal(); };
  acts.appendChild(clearBtn);
  acts.appendChild(sendBtn);
  acts.appendChild(deepBtn);
  acts.appendChild(leaveBtn);
  m.appendChild(acts);
  bg.appendChild(m);
  root.appendChild(bg);

  renderSageHistory();

  const input = document.getElementById("sage-input");
  input.focus();
  input.addEventListener("keydown", (e)=>{
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendSageMessage();
    }
  });
}

function renderSageHistory(){
  const box = document.getElementById("sage-history");
  if (!box) return;
  if (_sageHistory.length === 0){
    box.innerHTML = `<div class="sage-line sage-assistant"><i>The old sage warms his hands over the embers and looks up at you. "Sit. Ask what you will."</i></div>`;
    return;
  }
  box.innerHTML = _sageHistory.map(msg => {
    const cls = msg.role === "user" ? "sage-user" : "sage-assistant";
    const who = msg.role === "user" ? "You" : "Sage";
    return `<div class="sage-line ${cls}"><b>${who}:</b> ${escapeHtml(msg.content)}</div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function setSageStatus(text, cls){
  const s = document.getElementById("sage-status");
  if (!s) return;
  s.textContent = text;
  s.className = "sage-status " + (cls || "muted");
}

function setSageBusyState(busy){
  _sageBusy = busy;
  for (const id of ["sage-send","sage-deep"]){
    const b = document.getElementById(id);
    if (b) b.disabled = busy;
  }
}

function sendSageMessage(){
  if (_sageBusy) return;
  const input = document.getElementById("sage-input");
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  _sageHistory.push({role:"user", content:text});
  input.value = "";
  renderSageHistory();
  setSageBusyState(true);
  setSageStatus("The sage strokes his beard...", "info");

  setTimeout(()=>{
    const reply = offlineSageReply(G, text);
    _sageHistory.push({role:"assistant", content: reply});
    renderSageHistory();
    setSageStatus("", "muted");
    setSageBusyState(false);
    const i = document.getElementById("sage-input");
    if (i) i.focus();
  }, 250);
}

function beginSageDeepThink(){
  if (_sageBusy) return;
  const input = document.getElementById("sage-input");
  const prompt = input?.value.trim() || "What should I do next?";
  if (input) input.value = "";
  _sageHistory.push({role:"user", content:`Think deeper: ${prompt}`});
  _sageHistory.push({role:"assistant", content:"(The old sage closes his eyes. The fire gutters low. He is thinking deeper...)"});
  renderSageHistory();
  setSageBusyState(true);
  const modal = document.querySelector(".sage-modal");
  if (modal) modal.classList.add("deep-thinking");
  let step = 0;
  const states = [
    "THINKING DEEPER: reading the smoke...",
    "THINKING DEEPER: weighing hunger, water, warmth, danger...",
    "THINKING DEEPER: tracing the next three days...",
    "THINKING DEEPER: choosing the hard truth..."
  ];
  setSageStatus(states[0], "deep");
  if (_sageThinkTimer) clearInterval(_sageThinkTimer);
  _sageThinkTimer = setInterval(()=>{
    step++;
    setSageStatus(states[step % states.length], "deep");
  }, 700);
  setTimeout(()=>{
    if (_sageThinkTimer) clearInterval(_sageThinkTimer);
    _sageThinkTimer = null;
    const m = document.querySelector(".sage-modal");
    if (m) m.classList.remove("deep-thinking");
    _sageHistory = _sageHistory.filter((msg, idx) => idx !== _sageHistory.length - 1 || !msg.content.includes("thinking deeper"));
    _sageHistory.push({role:"assistant", content: offlineSageDeepReply(G, prompt)});
    renderSageHistory();
    setSageStatus("Deep counsel complete.", "good");
    setSageBusyState(false);
  }, 3600);
}

function offlineSageReply(g, text){
  const p = g.survivors[0];
  const q = text.toLowerCase();
  const urgent = detectHint(g);
  if (urgent && /what|next|help|stuck|do|advice|survive/.test(q)){
    return `The ash is speaking plainly: ${stripTags(urgent)} Do that first, then look farther down the road.`;
  }
  if (/water|thirst|drink/.test(q)){
    if (g.resources.water >= 1) return "Drink clean water now. A dry throat makes poor choices. After that, keep dirty water boiling while the fire still has wood.";
    if (g.resources.dirty_water >= 2 && g.resources.wood >= 1) return "You have what you need: boil the dirty water. Clean water beats courage every time.";
    return "Seek springs, wells, ponds, or streams on the map. Bring back dirty water if you must, but boil it before it becomes sickness.";
  }
  if (/food|hunger|starv|eat/.test(q)){
    if (g.resources.food >= 1) return "Eat before your hands shake. Then forage or cook meat and crops into proper food.";
    if (g.resources.meat >= 1 || g.resources.crops >= 2) return "There is a meal hiding in your stores. Cook it, then eat. Later, research Farming and put a worker in the soil.";
    return "Berries, mushrooms, roots, farms, and carcasses keep people alive. Search close to camp before pushing into teeth and ruins.";
  }
  if (/build|research|knowledge/.test(q)){
    const ready = KNOWLEDGE.filter(n => !g.knownNodes[n.id] && n.req.every(r=>g.knownNodes[r]) && g.knowledge >= n.cost);
    if (ready.length) return `Spend the knowledge while it is still warm. ${ready[0].name} is within reach and will open new tools for the settlement.`;
    return "Knowledge comes from days survived, books, schools, libraries, elders, and ruins. Gather it, then turn it into shelter, water, food, and walls.";
  }
  if (/job|worker|idle|assign/.test(q)){
    const idle = g.survivors.filter(s=>!s.isPlayer && !s.isChild && s.health>0 && (!g.jobs[s.id] || g.jobs[s.id]==="none"));
    if (idle.length) return `${idle.length} pair${idle.length>1?"s":""} of hands are idle. Assign woodcutters, gatherers, water carriers, or building workers. Idle hands do not fill bowls.`;
    return "Your workers are moving. Watch the stores: if food, water, or wood falls, change jobs before hunger teaches the lesson.";
  }
  if (/danger|raid|defen|wall|guard/.test(q)){
    const d = settlementDanger(g);
    if (d > 20) return `Danger is ${d}. Build walls, guard posts, and watchtowers. A proud town without teeth is just a feast with lanterns.`;
    return `Danger is ${d}. Keep it that way with walls, guards, and fewer foolish stockpiles than raiders can smell.`;
  }
  if (p.health < 35 || p.thirst < 30 || p.hunger < 30 || p.energy < 25) return stripTags(urgent || "Patch the body first: health, thirst, hunger, energy. Grand plans can wait one more breath.");
  return "Keep the fire fed, the water clean, the workers assigned, and the walls rising. When those are steady, scout ruins for books, tools, and people worth saving.";
}

function offlineSageDeepReply(g, prompt){
  const p = g.survivors[0];
  const delta = estimateDailyDelta(g);
  const ready = KNOWLEDGE.filter(n => !g.knownNodes[n.id] && n.req.every(r=>g.knownNodes[r]) && g.knowledge >= n.cost);
  const idle = g.survivors.filter(s=>!s.isPlayer && !s.isChild && s.health>0 && (!g.jobs[s.id] || g.jobs[s.id]==="none"));
  const housing = getHousing(g);
  const d = settlementDanger(g);
  const warnings = [];
  if (p.health < 40) warnings.push("your body is close to failing");
  if (p.thirst < 35 || (delta.water||0) < -0.5) warnings.push("water is the weak link");
  if (p.hunger < 35 || (delta.food||0) < -0.5) warnings.push("food will turn against you soon");
  if (p.warmth < 35) warnings.push("cold is slowing your steps");
  if (housing <= g.survivors.length) warnings.push("the camp has no spare beds");
  if (idle.length) warnings.push(`${idle.length} worker${idle.length>1?"s are":" is"} idle`);
  if (d > 20) warnings.push(`danger is high at ${d}`);
  const first = warnings.length ? `I looked deeper. The first truth: ${warnings.slice(0,3).join(", ")}.` : "I looked deeper. The camp is not safe, but it is steady enough to choose growth instead of panic.";

  const actions = [];
  if (p.thirst < 40 || (delta.water||0) < -0.5) actions.push("Secure water: find a spring or well, boil dirty water, or assign a water carrier / well worker.");
  if (p.hunger < 40 || (delta.food||0) < -0.5) actions.push("Stabilize food: forage now, cook meat or crops, then research Farming for gardens and fields.");
  if (p.warmth < 35) actions.push("Warm up before traveling. Low warmth now makes movement cost more energy and can start killing you before it reaches zero.");
  if (idle.length) actions.push("Assign every idle adult. Wood, water, and food jobs matter more than pride.");
  if (housing <= g.survivors.length) actions.push("Build housing next, or the people you save will have nowhere to become settlers.");
  if (ready.length) actions.push(`Spend knowledge on ${ready[0].name}; unused knowledge does not keep rain off your face.`);
  if (d > 20) actions.push("Raise defenses: guard posts, palisades, watchtowers, and weapons before the next raid tests you.");
  if (!actions.length) actions.push("Scout underground entrances and ruins for iron, parts, books, and medicine, but turn back before hunger, thirst, or cold slow your walk home.");

  const next = actions.slice(0,3).map((a,i)=>`${i+1}. ${a}`).join("\n");
  return `${first}\n\nDo this in order:\n${next}\n\nIf death takes you, only a living companion with skill or medicine may pull you back. Alone, the ash keeps what it is given.`;
}

function stripTags(s){ return String(s).replace(/<[^>]*>/g, ""); }

// ------------------------- SAVE / LOAD ------------------------------

function save(){
  try{
    normalizeGame(G);
    // assign ids to survivors that lack them
    for (const s of G.survivors){ if (s.id===undefined) s.id = G.nextSurvId++; }
    localStorage.setItem(SAVE_KEY, JSON.stringify(G));
  }catch(e){ console.warn("Save failed", e); }
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    G = parsed;
    normalizeGame(G);
    return true;
  }catch(e){ console.warn("Load failed", e); return false; }
}

function normalizeGame(g){
  if (!g || typeof g !== "object") return;
  if (g.day==null) g.day = 1;
  if (g.phase==null) g.phase = 0;
  if (!Array.isArray(g.log)) g.log = [];
  if (g.knowledge==null) g.knowledge = 0;
  if (g.reputation==null) g.reputation = 0;
  if (g.danger==null) g.danger = 0;
  if (!g.resources) g.resources = {};
  for (const k of RES_KEYS) if (g.resources[k]==null || !isFinite(g.resources[k])) g.resources[k] = 0;
  if (!g.buildings) g.buildings = {campfire:{count:1,dmg:0}};
  if (!g.buildings.campfire) g.buildings.campfire = {count:1,dmg:0};
  for (const id of Object.keys(g.buildings)){
    if (!BUILDINGS[id]) { delete g.buildings[id]; continue; }
    const st = g.buildings[id] || {};
    st.count = Math.max(0, Math.floor(st.count || 0));
    st.dmg = Math.max(0, st.dmg || 0);
    g.buildings[id] = st;
  }
  if (!Array.isArray(g.survivors)) g.survivors = [];
  if (!g.survivors.length) g.survivors.push(makeSurvivor("Survivor", true));
  if (!g.jobs) g.jobs = {};
  if (!g.workerAssign) g.workerAssign = {};
  if (!g.knownNodes) g.knownNodes = {};
  if (!Array.isArray(g.relationships)) g.relationships = [];
  if (!Array.isArray(g.followers)) g.followers = [];
  if (g.stepAccum==null) g.stepAccum = 0;
  if (!g.explored) g.explored = {};
  normalizeTown(g);
  if (!g.nextSurvId || g.nextSurvId < 1) g.nextSurvId = 1;
  for (const s of g.survivors.concat(g.followers)) normalizeSurvivor(g, s);
  g.survivors[0].isPlayer = true;
  const aliveIds = new Set(g.survivors.map(s=>s.id));
  for (const id of Object.keys(g.jobs)){
    const sid = Number(id);
    if (!aliveIds.has(sid) || !JOBS[g.jobs[id]]) delete g.jobs[id];
  }
  for (const s of g.survivors){
    if (!JOBS[g.jobs[s.id]]) g.jobs[s.id] = s.job || "none";
    if (!JOBS[g.jobs[s.id]]) g.jobs[s.id] = "none";
    s.job = g.jobs[s.id];
  }
  for (const bid of Object.keys(g.workerAssign)){
    if (!BUILDINGS[bid]) { delete g.workerAssign[bid]; continue; }
    const slots = (BUILDINGS[bid].workers || 0) * (g.buildings[bid]?.count || 0);
    const clean = [];
    for (const id of g.workerAssign[bid] || []){
      if (aliveIds.has(id) && clean.length < slots && !clean.includes(id)) clean.push(id);
    }
    g.workerAssign[bid] = clean;
  }
  if (!g.map || !Array.isArray(g.map) || g.map.length!==MAP_H){
    generateMap(g);
  } else {
    normalizeMap(g);
  }
  g.playerX = clamp(g.playerX ?? g.villageX ?? 0, 0, MAP_W-1);
  g.playerY = clamp(g.playerY ?? g.villageY ?? 0, 0, MAP_H-1);
  if (!inBounds(g.villageX, g.villageY)) { g.villageX = g.playerX; g.villageY = g.playerY; }
  placeSage(g);
}

function normalizeTown(g){
  if (!Array.isArray(g.town) || g.town.length!==TOWN_H){
    initTown(g);
  }
  for (let y=0; y<TOWN_H; y++){
    if (!Array.isArray(g.town[y])) g.town[y] = [];
    for (let x=0; x<TOWN_W; x++){
      const slot = g.town[y][x];
      if (!slot || !BUILDINGS[slot.building]) g.town[y][x] = null;
    }
  }
  if (!townBuildingCount(g, "campfire")){
    g.town[Math.floor(TOWN_H/2)][Math.floor(TOWN_W/2)] = {building:"campfire"};
  }
}

function normalizeSurvivor(g, s){
  if (!s.id && s.id!==0) s.id = g.nextSurvId++;
  if (s.id >= g.nextSurvId) g.nextSurvId = s.id + 1;
  if (!s.firstName) s.firstName = "Ash";
  if (s.lastName==null) s.lastName = "";
  if (!s.name) s.name = `${s.firstName} ${s.lastName}`.trim();
  if (s.maxHealth==null) s.maxHealth = 100;
  for (const k of ["health","hunger","thirst","energy","happiness","morale","warmth","safety"]){
    if (s[k]==null || !isFinite(s[k])) s[k] = k==="health" ? s.maxHealth : 60;
  }
  s.health = clamp(s.health, 0, s.maxHealth);
  s.hunger = clamp(s.hunger, 0, 100); s.thirst = clamp(s.thirst, 0, 100); s.energy = clamp(s.energy, 0, 100);
  s.happiness = clamp(s.happiness, 0, 100); s.morale = clamp(s.morale, 0, 100); s.warmth = clamp(s.warmth, 0, 100); s.safety = clamp(s.safety, 0, 100);
  if (!Array.isArray(s.traits)) s.traits = [];
  s.traits = s.traits.filter(t=>TRAITS[t]);
  if (!s.skills) s.skills = {};
  for (const k of ["combat","building","farming","medicine","crafting","hunting"]) if (s.skills[k]==null) s.skills[k] = 0;
  if (s.age==null) s.age = s.isChild ? 8 : 28;
  if (s.age_ticks==null) s.age_ticks = 0;
  if (s.daysSurvived==null) s.daysSurvived = 0;
  if (!Array.isArray(s.parentIds)) s.parentIds = [];
  if (!JOBS[s.job]) s.job = "none";
}

function normalizeMap(g){
  for (let y=0; y<MAP_H; y++){
    if (!Array.isArray(g.map[y])) g.map[y] = [];
    for (let x=0; x<MAP_W; x++){
      const t = g.map[y][x] || {};
      if (!BIOMES[t.biome]) t.biome = "plains";
      if (t.feature && !MAP_FEATURES[t.feature.type]) t.feature = null;
      if (t.feature && t.feature.charges==null) t.feature.charges = MAP_FEATURES[t.feature.type].charges;
      if (t.entity && !MAP_ENTITIES[t.entity.type]) t.entity = null;
      g.map[y][x] = {biome:t.biome, feature:t.feature||null, entity:t.entity||null};
    }
  }
}

function reset(){
  showModal({
    title:"Reset Game?",
    body:"<p>This will erase your save and start over.</p>",
    buttons:[
      {label:"Cancel", action:closeModal},
      {label:"Reset", primary:true, action:()=>{ localStorage.removeItem(SAVE_KEY); G = newGame(); save(); render(); closeModal();}}
    ]
  });
}

// ------------------------- HELP ------------------------------

function help(){
  showModal({
    title:"ASHES OF TOMORROW — How to Play",
    body:`
    <p><b>World Map</b>: use <b>WASD / arrow keys</b> or <b>click a tile</b> to walk. Walking costs energy; biomes have different terrain costs. Cold, hunger, thirst, injury, and disease slow you down by increasing movement cost. Vision shrinks at night. Use <b>Live</b> and the speed button to let time pass in real time.</p>
    <p><b>Interact by walking into things.</b> Step onto a feature to loot it, step into a hostile creature to fight, step into a friendly NPC to talk. Bring friendly survivors back next to your 🔥 campfire to recruit them — they show up in the "Following" strip while they're with you.</p>
    <p><b>Survive day by day.</b> Manage hunger, thirst, warmth, energy and health. Very low hunger, thirst, or warmth now damages health even before hitting zero. If you die alone it is game over; a living companion with medicine or medical skill may rescue you once that day.</p>
    <p><b>Town Building</b> — choose Place in the Build tab, then click an empty plot in the Town tab. Walls, gates, homes, farms, workshops and defenses appear on the settlement grid.</p>
    <p><b>Early game</b> — find a water source on the map, get food, place a tent/shelter, a storage shed, and a rain barrel. Then go hunting for survivors.</p>
    <p><b>Hostiles</b> on the map (raiders, bears, infected, mutants…) attack on contact — fight or flee. Weapons + ammo help, leather/tools mitigate damage. Some traps are hidden until you step on them.</p>
    <p><b>Hazards</b> — radioactive zones, swamps, acid pools, plague nests can damage or sicken you. Hot springs heal. Mines, caves, storm drains, and subway stairs can be entered for underground expeditions.</p>
    <p><b>Survivors</b> can be assigned jobs. Buildings with worker slots produce more goods per day. Research <b>knowledge</b> to unlock farming, medicine, walls, towers and more.</p>
    <p><b>Bigger town = bigger danger.</b> Walls, guard posts and watchtowers reduce raids.</p>
    <p><b>Family system</b>: adults may form bonds and have children if housing allows. Children grow and become workers; schools speed this up.</p>
    <p>The game autosaves after every action.</p>
    `,
    buttons:[{label:"Got it", primary:true, action:closeModal}]
  });
}

// ------------------------- WIRE UP ------------------------------

function init(){
  if (!load()){
    G = newGame();
    // Assign player id
    G.survivors[0].id = G.nextSurvId++;
    G.jobs[G.survivors[0].id] = "none";
  } else {
    // Ensure player id exists
    if (G.survivors[0].id===undefined) G.survivors[0].id = G.nextSurvId++;
  }
  document.getElementById("btn-rest").onclick = ()=> playerAction("sleep");
  document.getElementById("btn-rt").onclick = toggleRealtime;
  document.getElementById("btn-speed").onclick = cycleRealtimeSpeed;
  document.getElementById("btn-save").onclick = ()=> { save(); pushLog(G,"Game saved.","info"); render(); };
  document.getElementById("btn-load").onclick = ()=> { if (load()) { pushLog(G,"Game loaded.","info"); render(); } };
  document.getElementById("btn-reset").onclick = reset;
  document.getElementById("btn-help").onclick = help;

  // Keyboard movement
  window.addEventListener("keydown", e=>{
    const tag = (e.target.tagName||"").toLowerCase();
    if (tag==="input"||tag==="select"||tag==="textarea") return;
    if (document.getElementById("modal-root").firstChild) return; // modal open
    if (_activeTab !== "map") return;
    let dx=0, dy=0;
    switch (e.key){
      case "ArrowUp": case "w": case "W": dy=-1; break;
      case "ArrowDown": case "s": case "S": dy=1; break;
      case "ArrowLeft": case "a": case "A": dx=-1; break;
      case "ArrowRight": case "d": case "D": dx=1; break;
      case " ": cancelAutoWalk(); render(); return;
      default: return;
    }
    e.preventDefault();
    cancelAutoWalk();
    if (tryMove(G, dx, dy)){
      render(); save();
    } else {
      render();
    }
  });

  render();
}

window.addEventListener("load", init);
</script>

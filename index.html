<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Post 2045</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23120f0b'/%3E%3Cpath d='M20 51h24' stroke='%23856a46' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M24 48l16-11M40 48L24 37' stroke='%23856a46' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 43c-9-6-3-14 1-19 1 6 8 8 8 15 0 6-4 10-9 10z' fill='%23ff9f1c'/%3E%3Cpath d='M30 46c-5-4-1-9 2-13 1 4 5 5 5 10 0 4-3 7-7 7z' fill='%23ffd166'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
<script>
document.title = "Post 2045";
window.addEventListener("DOMContentLoaded", function(){
  var title = document.querySelector("header h1");
  if (title) title.textContent = "POST 2045";
});
</script>
</head>
<body>
<div id="app">
  <header>
    <h1>POST 2045</h1>
    <div class="topstats">
      <span>Day <b id="hud-day">1</b></span>
      <span id="hud-phase">Morning</span>
      <span>Pop: <b id="hud-pop">1</b></span>
      <span>Danger: <b id="hud-danger">0</b></span>
      <span>Rep: <b id="hud-rep">0</b></span>
      <span>Knowledge: <b id="hud-know">0</b></span>
    </div>
    <div class="ctrls">
      <button id="btn-rest" title="Sleep until next morning">Sleep</button>
      <button id="btn-rt" class="small" title="Toggle real-time ticking">Paused</button>
      <button id="btn-speed" class="small" title="Change real-time speed">1x</button>
      <button id="btn-save" class="small">Save</button>
      <button id="btn-load" class="small">Load</button>
      <button id="btn-reset" class="small danger">Reset</button>
      <button id="btn-help" class="small">?</button>
    </div>
  </header>
  <main>
    <aside class="panel" id="left-panel">
      <!-- Character + settlement summary -->
    </aside>
    <section class="center" id="center-panel">
      <div class="tabs" id="tabs"></div>
      <div id="tab-content"></div>
    </section>
    <aside class="panel right" id="right-panel">
      <!-- Event log + resources -->
    </aside>
  </main>
</div>
<div id="modal-root"></div>


<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/helpers.js"></script>
<script src="js/actions.js"></script>
<script src="js/world-map.js"></script>
<script src="js/render.js"></script>
<script src="js/advisor.js"></script>
<script src="js/modal.js"></script>
<script src="js/persistence.js"></script>
<script src="js/help.js"></script>
<script src="js/main.js"></script>
</body>
</html>

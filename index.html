function makeSurvivor(roleTitle="Survivor", isPlayer=false){
  const first = pick(FIRST_NAMES);
  const last  = pick(LAST_NAMES);
  const traits = randomTraits();
  const s = {
    id: undefined, // filled at insert
    firstName:first, lastName:last,
    name: `${first} ${last}`,
    age: isPlayer ? 28 : (12 + Math.floor(rng()*40)),
    isChild: false,
    isPlayer: !!isPlayer,
    health:100, hunger:80, thirst:80, energy:100, happiness:60, morale:60, warmth:60,
    safety:50, // mostly tracked for player UI
    maxHealth: traits.includes("tough") ? 120 : 100,
    knowledge:0,
    traits,
    job:"none",
    skills: randomSkills(),
    sex: rng()<0.5 ? "M" : "F",
    partnerId: null,
    parentIds: [],
    age_ticks:0,
    daysSurvived:0,
    diseased:false,
    injured:false,
  };
  return s;
}

function randomTraits(){
  const pool = Object.keys(TRAITS);
  const n = 1 + Math.floor(rng()*2);
  const set = new Set();
  while(set.size < n){ set.add(pick(pool)); }
  // remove logical contradictions
  if (set.has("brave") && set.has("cowardly")) set.delete("cowardly");
  if (set.has("hardworking") && set.has("lazy")) set.delete("lazy");
  return Array.from(set);
}

function randomSkills(){
  return {
    combat:    Math.floor(rng()*4),
    building:  Math.floor(rng()*4),
    farming:   Math.floor(rng()*4),
    medicine:  Math.floor(rng()*4),
    crafting:  Math.floor(rng()*4),
    hunting:   Math.floor(rng()*4),
  };
}

// ------------------------- HELPERS ------------------------------

let _seed = 12345;
function srand(s){ _seed = s|0 || 12345; }
function rng(){
  // xorshift for reproducible-ish randomness, but Math.random for most calls
  return Math.random();
}
function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }
function rint(min,max){ return min + Math.floor(rng()*(max-min+1)); }
function chance(p){ return rng() < p; }
function clamp(x,lo,hi){ return Math.max(lo, Math.min(hi,x)); }
function fmt(n){ return (Math.round(n*10)/10).toString(); }

function pushLog(g, msg, type="info"){
  if (type==="dim") type = "info";
  g.log.unshift({day:g.day, phase:g.phase, msg, type});
  if (g.log.length > 200) g.log.length = 200;
}

function totalStorageCap(g){
  let cap = BASE_RES_CAP;
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    const eff = b.effects || {};
    if (eff.storage) cap += eff.storage * g.buildings[id].count;
  }
  return cap;
}

function foodStorageCap(g){
  let cap = totalStorageCap(g);
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    const eff = b.effects || {};
    if (eff.food_storage) cap += eff.food_storage * g.buildings[id].count;
  }
  return cap;
}

function addResource(g, key, amount){
  const cap = (key==="food"||key==="crops"||key==="meat") ? foodStorageCap(g) : totalStorageCap(g);
  const before = g.resources[key];
  g.resources[key] = clamp(g.resources[key] + amount, 0, cap);
  return g.resources[key] - before;
}

function initTown(g){
  g.town = [];
  for (let y=0; y<TOWN_H; y++){
    const row = [];
    for (let x=0; x<TOWN_W; x++) row.push(null);
    g.town.push(row);
  }
  const cx = Math.floor(TOWN_W/2), cy = Math.floor(TOWN_H/2);
  g.town[cy][cx] = {building:"campfire"};
}

function townBuildingCount(g, id){
  if (!g.town) return 0;
  let n = 0;
  for (let y=0; y<TOWN_H; y++) for (let x=0; x<TOWN_W; x++){
    if (g.town[y]?.[x]?.building === id) n++;
  }
  return n;
}

function placeTownBuilding(g, id, x, y){
  if (!g.town || !inTownBounds(x,y) || g.town[y][x]) return false;
  g.town[y][x] = {building:id};
  return true;
}

function inTownBounds(x,y){ return x>=0 && y>=0 && x<TOWN_W && y<TOWN_H; }

function canPay(g, cost){
  for (const k in cost){ if ((g.resources[k]||0) < cost[k]) return false; }
  return true;
}
function pay(g, cost){
  for (const k in cost){ g.resources[k] -= cost[k]; }
}
function costString(cost){
  return Object.entries(cost).map(([k,v])=>`${RESOURCES[k]?.icon||""}${v} ${RESOURCES[k]?.name||k}`).join(", ");
}

function getHousing(g){
  let cap = 1; // campfire houses 1 minimally
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    const eff = b.effects || {};
    if (eff.housing) cap += eff.housing * g.buildings[id].count;
  }
  return cap;
}

function adults(g){ return g.survivors.filter(s=>!s.isChild); }
function children(g){ return g.survivors.filter(s=>s.isChild); }
function workforce(g){ return adults(g).filter(s=>s.health>0); }
function nonPlayerAdults(g){ return adults(g).filter(s=>!s.isPlayer); }

function survivorById(g,id){ return g.survivors.find(s=>s.id===id); }

function workersAt(g, bid){
  return (g.workerAssign[bid] || []).map(id=>survivorById(g,id)).filter(Boolean);
}

function isUnlocked(g, buildingId){
  // campfire is always available
  if (buildingId==="campfire") return true;
  for (const node of KNOWLEDGE){
    if (g.knownNodes[node.id]) continue;
    const ub = node.unlock?.buildings || [];
    if (ub.includes(buildingId)) {
      // not yet unlocked
    }
  }
  // Check all nodes; building is unlocked if at least one unlocked node grants it
  for (const node of KNOWLEDGE){
    if (!g.knownNodes[node.id]) continue;
    const ub = node.unlock?.buildings || [];
    if (ub.includes(buildingId)) return true;
  }
  return false;
}

function jobAvailable(g, jobKey){
  if (jobKey==="none") return true;
  const j = JOBS[jobKey];
  if (!j) return false;
  if (j.building){
    if (!g.buildings[j.building]) return false;
    // Count workers vs slots
    const built = g.buildings[j.building].count;
    const slots = (BUILDINGS[j.building].workers || 0) * built;
    const used = (g.workerAssign[j.building] || []).length;
    return used < slots;
  }
  return true;
}

function settlementDanger(g){
  let d = 0;
  d += g.survivors.length * 1.2;
  d += Object.values(g.buildings).reduce((a,b)=>a+b.count,0) * 0.4;
  let stored = 0; for (const k in g.resources) stored += g.resources[k];
  d += stored * 0.005;
  d += g.reputation * 0.1;
  // Reduce by defenses
  let walls = 0, guards = 0, danger_reduce=0;
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    const eff = b.effects || {};
    if (eff.wall) walls += eff.wall * g.buildings[id].count;
    if (eff.danger_reduce) danger_reduce += eff.danger_reduce * g.buildings[id].count;
    if (eff.safety_per_worker) guards += eff.safety_per_worker * (g.workerAssign[id]?.length || 0);
  }
  d -= walls * 0.15;
  d -= guards * 0.3;
  d -= danger_reduce;
  return Math.max(0, Math.round(d));
}

function settlementSafety(g){
  let s = 30;
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    const eff = b.effects || {};
    if (eff.safety_per_worker) s += eff.safety_per_worker * (g.workerAssign[id]?.length || 0);
    if (eff.wall) s += eff.wall * 0.5 * g.buildings[id].count;
  }
  s -= settlementDanger(g) * 0.6;
  return clamp(Math.round(s),0,100);
}

// ------------------------- ACTIONS ------------------------------

function passPhase(g, phases=1, reason=""){
  for (let i=0; i<phases; i++){
    advanceOnePhase(g);
  }
}

function advanceOnePhase(g){
  g.phase++;
  if (g.phase >= TICKS_PER_DAY){
    g.phase = 0;
    g.day++;
    onDayEnd(g);
  }
  applyTick(g);
}

function applyTick(g){
  // Decay needs per tick
  const player = g.survivors[0];
  const night = g.phase===3;
  // Player
  decaySurvivor(g, player, /*isPlayer*/true, night);
  // Other survivors
  for (let i=1; i<g.survivors.length; i++){
    decaySurvivor(g, g.survivors[i], false, night);
  }

  // Building production (per tick)
  produceFromBuildings(g);
  produceFromJobs(g);

  // Auto-consumption: survivors eat & drink when needed at end of each tick
  autoConsume(g);

  // Update body class for night
  document.body.classList.toggle("night", night);

  // Random small events occasionally
  if (chance(0.15)) maybeRandomEvent(g);
}

function decaySurvivor(g, s, isPlayer, night){
  if (s.health<=0) return;
  // children consume less but still need food/water
  const factor = s.isChild ? 0.5 : 1;
  s.hunger = clamp(s.hunger - 4*factor, 0, 100);
  s.thirst = clamp(s.thirst - 5*factor, 0, 100);
  s.energy = clamp(s.energy - (isPlayer? 3 : 2), 0, 100);
  s.warmth = clamp(s.warmth - (night? 6 : 2)*factor, 0, 100);

  // happiness drifts
  if (s.hunger < 30 || s.thirst < 30) s.happiness = clamp(s.happiness - 2, 0, 100);
  if (s.warmth < 30) s.happiness = clamp(s.happiness - 1, 0, 100);

  // warmth bonus from campfire
  const hasFire = (g.buildings.campfire?.count||0) > 0 && (g.resources.wood>0 || g.resources.charcoal>0);
  if (night && hasFire) s.warmth = clamp(s.warmth + 4, 0, 100);

  // health effects
  if (s.hunger < 15) s.health = clamp(s.health - 1, 0, s.maxHealth);
  if (s.thirst < 15) s.health = clamp(s.health - 2, 0, s.maxHealth);
  if (s.warmth < 15) s.health = clamp(s.health - (night?2:1), 0, s.maxHealth);
  if (s.hunger <= 0) s.health = clamp(s.health - 3, 0, s.maxHealth);
  if (s.thirst <= 0) s.health = clamp(s.health - 5, 0, s.maxHealth);
  if (s.warmth <= 0) s.health = clamp(s.health - (night?4:1), 0, s.maxHealth);

  // disease decays health
  if (s.diseased) s.health = clamp(s.health - 2, 0, s.maxHealth);

  // morale tracked from happiness/safety
  const safety = settlementSafety(g);
  s.morale = clamp((s.happiness*0.5 + safety*0.5), 0, 100);

  // For player, mirror safety to a field
  if (isPlayer) s.safety = safety;

  if (s.health <= 0 && !s._died){
    s._died = true;
    pushLog(g, `${s.isPlayer?"You have":(s.name+" has")} died.`, "bad");
    if (isPlayer) removeDead(g);
  }
}

function produceFromBuildings(g){
  // Per-tick production = (per-day amount)/TICKS_PER_DAY
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    const count = g.buildings[id].count;
    const assigned = g.workerAssign[id] || [];
    const eff = b.effects || {};

    if (eff.produce){
      for (const r in eff.produce){
        addResource(g, r, (eff.produce[r] * count)/TICKS_PER_DAY);
      }
    }
    if (eff.produce_per_worker){
      for (const r in eff.produce_per_worker){
        const skillBoost = workerSkillBonus(g, id, assigned);
        addResource(g, r, (eff.produce_per_worker[r] * assigned.length * skillBoost)/TICKS_PER_DAY);
      }
    }
    if (eff.consume){
      for (const r in eff.consume){
        const need = (eff.consume[r] * count)/TICKS_PER_DAY;
        if ((g.resources[r]||0) >= need) g.resources[r] -= need;
      }
    }
    if (eff.convert){
      const conv = eff.convert;
      const max = (conv.perWorker||1) * assigned.length;
      let runs = max / TICKS_PER_DAY;
      // limit by inputs
      for (const r in conv.from){
        const possible = (g.resources[r]||0) / conv.from[r];
        runs = Math.min(runs, possible);
      }
      if (runs > 0){
        for (const r in conv.from){ g.resources[r] -= conv.from[r] * runs; }
        for (const r in conv.to){ addResource(g, r, conv.to[r] * runs); }
      }
    }
    if (eff.knowledge){
      g.knowledge += (eff.knowledge * count)/TICKS_PER_DAY;
    }
    if (eff.knowledge_per_worker){
      g.knowledge += (eff.knowledge_per_worker * assigned.length)/TICKS_PER_DAY;
    }
    if (eff.heal_per_worker){
      // heal injured survivors
      const power = eff.heal_per_worker * assigned.length / TICKS_PER_DAY;
      let pwr = power;
      for (const s of g.survivors){
        if (s.health < s.maxHealth && pwr>0){
          const heal = Math.min(pwr, s.maxHealth-s.health);
          s.health += heal; pwr -= heal;
          if (s.injured && s.health > 60) s.injured = false;
        }
      }
    }
    if (eff.disease_resist && assigned.length){
      for (const s of g.survivors){
        if (s.diseased && chance(eff.disease_resist * assigned.length / TICKS_PER_DAY)){
          s.diseased = false;
          s.health = clamp(s.health + 4, 0, s.maxHealth);
          pushLog(g, `${s.isPlayer?"You":s.name} recovered with help from ${b.name}.`, "good");
        }
      }
    }
    if (eff.combat_train && assigned.length){
      for (const id of assigned){
        const s = survivorById(g, id);
        if (s) s.skills.combat = Math.min(20, s.skills.combat + (eff.combat_train / TICKS_PER_DAY));
      }
    }
    if (eff.repair && assigned.length){
      const power = eff.repair * assigned.length / TICKS_PER_DAY;
      for (const bid in g.buildings){
        const st = g.buildings[bid];
        if (st && st.dmg > 0){
          st.dmg = Math.max(0, st.dmg - power);
          break;
        }
      }
    }
    if (eff.happiness_all){
      const v = eff.happiness_all * count / TICKS_PER_DAY;
      for (const s of g.survivors) s.happiness = clamp(s.happiness + v, 0, 100);
    }
    if (eff.morale_all){
      const v = eff.morale_all * count / TICKS_PER_DAY;
      for (const s of g.survivors) s.morale = clamp(s.morale + v, 0, 100);
    }
    if (eff.reputation){
      g.reputation += eff.reputation * count / TICKS_PER_DAY;
    }
    if (eff.attract_chance){
      if (chance(eff.attract_chance * count / TICKS_PER_DAY)){
        spawnStranger(g);
      }
    }
    if (eff.trade_chance){
      if (chance(eff.trade_chance * count / TICKS_PER_DAY)){
        traderArrives(g);
      }
    }
    if (eff.warning){
      // handled at raid roll
    }
    if (eff.cook){
      // cooking is a player action; passive contribution: tiny food gain if meat/crops
    }
  }
}

function produceFromJobs(g){
  for (const s of g.survivors){
    if (!s || s.isPlayer || s.isChild || s.health<=0) continue;
    const jobKey = g.jobs[s.id] || s.job || "none";
    const job = JOBS[jobKey];
    if (!job || jobKey==="none" || job.building) continue;
    const boost = workerJobBonus(s, jobKey);
    for (const r in job.output || {}){
      addResource(g, r, job.output[r] * boost / TICKS_PER_DAY);
    }
    if (jobKey==="scavenger" && chance(0.08 / TICKS_PER_DAY)){
      const dmg = rint(3,10);
      s.health = clamp(s.health - dmg, 0, s.maxHealth);
      if (s.health < 50) s.injured = true;
      pushLog(g, `${s.name} was hurt while scavenging.`, "warn");
    }
    if ((jobKey==="builder" || jobKey==="wallbuilder") && chance(0.35 / TICKS_PER_DAY)){
      const damaged = Object.keys(g.buildings).find(id => (g.buildings[id]?.dmg||0) > 0);
      if (damaged) g.buildings[damaged].dmg = Math.max(0, g.buildings[damaged].dmg - 1 * boost);
    }
  }
}

function workerJobBonus(s, jobKey){
  let bonus = 1;
  if (s.traits.includes("hardworking")) bonus += 0.25;
  if (s.traits.includes("lazy")) bonus -= 0.25;
  if ((jobKey==="woodcutter" || jobKey==="builder" || jobKey==="wallbuilder") && s.traits.includes("builder")) bonus += 0.2;
  if ((jobKey==="gatherer" || jobKey==="water_carrier") && s.traits.includes("farmer")) bonus += 0.15;
  if (jobKey==="scavenger" && s.traits.includes("quick")) bonus += 0.15;
  if (s.traits.includes("leader")) bonus += 0.1;
  if (s.traits.includes("troublemaker")) bonus -= 0.1;
  if (s.happiness < 30) bonus -= 0.2;
  if (s.health < 50) bonus -= 0.2;
  return Math.max(0.2, bonus);
}

function workerSkillBonus(g, bid, assigned){
  // base 1.0, +trait bonuses
  if (!assigned.length) return 1;
  let total = 0;
  for (const id of assigned){
    const s = survivorById(g, id);
    if (!s) continue;
    let bonus = 1;
    if (s.traits.includes("hardworking")) bonus += 0.25;
    if (s.traits.includes("lazy")) bonus -= 0.25;
    // building-specific
    const b = bid;
    if ((b==="hunting_lodge") && s.traits.includes("hunter")) bonus += 0.3;
    if ((b==="crop_field"||b==="garden"||b==="greenhouse") && s.traits.includes("farmer")) bonus += 0.3;
    if ((b==="clinic"||b==="medicine_workshop"||b==="herbalist") && s.traits.includes("medic")) bonus += 0.3;
    if ((b==="workshop"||b==="toolsmith"||b==="forge"||b==="carpenter"||b==="sawmill") && s.traits.includes("builder")) bonus += 0.2;
    if ((b==="kitchen"||b==="smokehouse") && s.traits.includes("cook")) bonus += 0.3;
    if ((b==="mechanics_shed"||b==="repair_station") && s.traits.includes("mechanic")) bonus += 0.3;
    if ((b==="guard_post"||b==="watchtower"||b==="barracks") && s.traits.includes("guard")) bonus += 0.3;
    if ((b==="school"||b==="library") && s.traits.includes("teacher")) bonus += 0.3;
    if (s.traits.includes("leader")) bonus += 0.1;
    if (s.traits.includes("troublemaker")) bonus -= 0.1;
    // happiness penalty
    if (s.happiness < 30) bonus -= 0.2;
    if (s.health < 50) bonus -= 0.2;
    total += Math.max(0.2, bonus);
  }
  return total / assigned.length;
}

function autoConsume(g){
  // Each tick, each survivor eats a little and drinks a little if available
  for (const s of g.survivors){
    if (s.health<=0) continue;
    if (s.hunger < 70 && g.resources.food >= 1){
      g.resources.food -= 1; s.hunger = clamp(s.hunger + 25, 0, 100);
    } else if (s.hunger < 50 && g.resources.crops >= 2){
      g.resources.crops -= 2; s.hunger = clamp(s.hunger + 15, 0, 100);
    } else if (s.hunger < 50 && g.resources.meat >= 1){
      g.resources.meat -= 1; s.hunger = clamp(s.hunger + 20, 0, 100);
    }
    if (s.thirst < 70 && g.resources.water >= 1){
      g.resources.water -= 1; s.thirst = clamp(s.thirst + 25, 0, 100);
    } else if (s.thirst < 30 && g.resources.dirty_water >= 1){
      g.resources.dirty_water -= 1; s.thirst = clamp(s.thirst + 15, 0, 100);
      if (chance(0.1) && !s.diseased){ s.diseased = true; pushLog(g, `${s.isPlayer?"You":s.name} fell sick from dirty water.`,"bad"); }
    }
  }
  // Campfire consumes 1 wood every full day in evening tick
  if (g.phase===2 && g.buildings.campfire?.count){
    if (g.resources.wood >= 1) g.resources.wood -= 1;
    else if (g.resources.charcoal >= 1) g.resources.charcoal -= 1;
    else { pushLog(g, "Your campfire has gone out. The cold creeps in.","warn"); }
  }
}

function onDayEnd(g){
  // age survivors, day survived counts
  for (const s of g.survivors){
    s.daysSurvived++;
    s.age_ticks += 1;
    if (s.isChild){
      // growth boosted by school
      let g_rate = 1;
      const schoolWorkers = (g.workerAssign.school?.length||0);
      if (g.buildings.school?.count && schoolWorkers>0) g_rate += BUILDINGS.school.effects.child_growth;
      s.age_ticks += g_rate;
      if (s.age_ticks > 80){ // about 20 days base
        s.isChild = false;
        s.age = 14;
        s.skills.crafting += 1;
        pushLog(g, `${s.name} has grown into an adult.`, "good");
      }
    }
    // disease cure chance from medicine
    if (s.diseased){
      if (g.resources.medicine >= 1){
        g.resources.medicine -= 1; s.diseased = false; s.health = clamp(s.health+10,0,s.maxHealth);
        pushLog(g, `${s.isPlayer?"You":s.name} recovered using medicine.`,"good");
      } else if (chance(0.1)) {
        s.diseased = false; pushLog(g, `${s.isPlayer?"You":s.name} recovered from illness.`,"good");
      }
    }
  }

  // Knowledge from surviving
  g.knowledge += 0.5 + g.survivors.length * 0.05;

  // Daily morale roll: relationships forming
  if (chance(0.18)) tryRelationship(g);
  // Daily birth roll
  for (const rel of g.relationships){
    if (rel.type==="partner"){
      const a = survivorById(g,rel.a), b = survivorById(g,rel.b);
      if (!a||!b) continue;
      if (a.isChild||b.isChild) continue;
      // need housing for new child
      if (getHousing(g) > g.survivors.length){
        if (chance(0.04)){
          birthChild(g, a, b);
        }
      }
    }
  }

  // Threat / raid rolls
  rollThreats(g);

  // Cleanup dead
  removeDead(g);

  // Refresh world map
  refreshMapDaily(g);

  // Notify of new day
  pushLog(g, `— Day ${g.day} begins —`, "info");
}

function removeDead(g){
  // bury dead after a day
  for (let i=g.survivors.length-1; i>=0; i--){
    const s = g.survivors[i];
    if (s.health<=0){
      // unassign
      if (g.jobs[s.id]) delete g.jobs[s.id];
      for (const bid in g.workerAssign){
        g.workerAssign[bid] = g.workerAssign[bid].filter(id=>id!==s.id);
      }
      if (s.isPlayer){
        if (attemptPlayerRescue(g, s)) return;
        // game over modal
        showModal({
          title:"You Have Perished",
          body:`<p>Your watch has ended on day ${g.day}.</p><p>Others may carry on, but without you the settlement falters.</p>`,
          buttons:[{label:"New Run", primary:true, action:()=>{ G = newGame(); save(); render(); closeModal();}}]
        });
        return;
      }
      // remove relationships
      g.relationships = g.relationships.filter(r=> r.a!==s.id && r.b!==s.id);
      g.survivors.splice(i,1);
      // morale drop
      for (const o of g.survivors) o.happiness = clamp(o.happiness - 8, 0, 100);
    }
  }
}

function attemptPlayerRescue(g, player){
  if (player.lastRescueDay === g.day) return false;
  const helpers = g.survivors.concat(g.followers || []).filter(s => s && !s.isPlayer && s.health > 0);
  if (!helpers.length) return false;
  const medic = helpers.find(s => s.traits?.includes("medic") || s.skills?.medicine >= 4);
  if (!medic && g.resources.medicine < 1) return false;
  if (g.resources.medicine >= 1) g.resources.medicine -= 1;
  const healer = medic || pick(helpers);
  player.health = medic ? 35 : 22;
  player.energy = clamp(player.energy + 20, 0, 100);
  player.hunger = Math.max(player.hunger, 20);
  player.thirst = Math.max(player.thirst, 20);
  player.warmth = Math.max(player.warmth, 20);
  player.injured = true;
  player._died = false;
  player.lastRescueDay = g.day;
  if (player.diseased && medic && chance(0.7)) player.diseased = false;
  pushLog(g, `${healer.name} drags you back from death. Next time may be final.`, "good");
  showModal({
    title:"Pulled Back From Death",
    body:`<p>${healer.name} found you fading and patched you up.</p><p>You are alive, injured, and badly shaken.</p>`,
    buttons:[{label:"Keep going", primary:true, action:()=>{ closeModal(); render(); save(); }}]
  });
  return true;
}

// --- Player Actions ---

const RECOVERY_ACTIONS = new Set(["rest","sleep","eat","drink"]);

function playerAction(actionKey){
  const g = G;
  const p = g.survivors[0];
  if (p.health<=0) return;
  if (p.energy < 5 && !RECOVERY_ACTIONS.has(actionKey)){
    pushLog(g, "You are too exhausted. Rest or sleep first.","warn");
    render(); return;
  }
  switch(actionKey){
    case "chop_wood":{
      const amount = rint(3,6) + (p.traits.includes("hardworking")?1:0);
      addResource(g, "wood", amount);
      p.energy -= 10; p.hunger -= 4; p.thirst -= 4;
      pushLog(g, `You chopped wood. (+${amount} wood)`, "good");
      passPhase(g,1); break;
    }
    case "gather":{
      const food = rint(1,3), herbs = rint(0,2), seeds = rint(0,2);
      addResource(g,"food",food); addResource(g,"herbs",herbs); addResource(g,"seeds",seeds);
      p.energy -= 8; p.hunger -= 3; p.thirst -= 3;
      pushLog(g,`You foraged. (+${food} food, +${herbs} herbs, +${seeds} seeds)`,"good");
      passPhase(g,1); break;
    }
    case "fetch_water":{
      const amt = rint(3,6);
      addResource(g, "dirty_water", amt);
      p.energy -= 8; p.hunger -= 2; p.thirst -= 5;
      pushLog(g, `You fetched water. (+${amt} dirty water)`, "good");
      passPhase(g,1); break;
    }
    case "boil_water":{
      const cost = {dirty_water:2, wood:1};
      if (!canPay(g,cost)){ pushLog(g,"Need 2 dirty water and 1 wood.","warn"); render(); return; }
      pay(g,cost); addResource(g,"water",2);
      p.energy -= 4;
      pushLog(g,"You boiled water. (+2 clean water)","good");
      passPhase(g,1); break;
    }
    case "cook":{
      const cost = (g.resources.meat>=1?{meat:1, wood:1}:{crops:2, wood:1});
      if (!canPay(g,cost)){ pushLog(g,"Need either 1 meat or 2 crops, and 1 wood.","warn"); render(); return; }
      pay(g,cost); addResource(g,"food",3);
      p.energy -= 5;
      pushLog(g,"You cooked a meal. (+3 food)","good");
      passPhase(g,1); break;
    }
    case "eat":{
      if (g.resources.food<1){ pushLog(g,"No food to eat.","warn"); render(); return; }
      g.resources.food -= 1; p.hunger = clamp(p.hunger+30,0,100);
      pushLog(g,"You ate a small meal.","good"); render(); save(); return;
    }
    case "drink":{
      if (g.resources.water>=1){ g.resources.water -= 1; p.thirst = clamp(p.thirst+30,0,100); pushLog(g,"You drank clean water.","good"); }
      else if (g.resources.dirty_water>=1){ g.resources.dirty_water -= 1; p.thirst = clamp(p.thirst+20,0,100); if (chance(0.15)){ p.diseased = true; pushLog(g,"You drank dirty water and fell ill.","bad"); } else pushLog(g,"You drank dirty water uneasily.","warn");}
      else { pushLog(g,"No water available.","warn"); }
      render(); save(); return;
    }
    case "rest":{
      // short rest restores energy
      const gain = rint(15,25);
      p.energy = clamp(p.energy + gain, 0, 100);
      pushLog(g, `You rested briefly. (+${gain} energy)`, "info");
      passPhase(g,1); break;
    }
    case "sleep":{
      // sleep until next morning
      const phases = (TICKS_PER_DAY - g.phase) + 0; // remaining phases of today end the day at next morning
      passPhase(g, phases);
      p.energy = clamp(p.energy + 60, 0, 100);
      p.hunger = clamp(p.hunger - 6, 0, 100);
      p.thirst = clamp(p.thirst - 6, 0, 100);
      pushLog(g, "You slept until morning.", "info");
      break;
    }
    case "train":{
      // train combat
      if (!g.buildings.training_yard){ pushLog(g,"No training yard available.","warn"); render(); return; }
      p.skills.combat += 1;
      p.energy -= 12; p.hunger -= 4;
      pushLog(g,"You trained at the yard. (+combat)","good");
      passPhase(g,1); break;
    }
    case "study":{
      if (g.resources.books < 1){ pushLog(g,"Need a book to study.","warn"); render(); return; }
      g.resources.books -= 1;
      const kp = rint(2,5);
      g.knowledge += kp;
      p.energy -= 6;
      pushLog(g,`You studied a book. (+${kp} knowledge)`,"good");
      passPhase(g,1); break;
    }
  }
  render(); save();
}

function explore(locKey){
  const g = G;
  const p = g.survivors[0];
  if (p.health<=0) return;
  const loc = LOCATIONS[locKey]; if (!loc) return;
  if (p.energy < loc.energy){ pushLog(g,`Too exhausted to explore ${loc.name}.`,"warn"); render(); return; }
  pushLog(g, `You set out to ${loc.name}.`,"info");

  // enemy encounter chance scales with danger
  if (chance(0.18 + loc.danger * 0.07)){
    const enemyKey = pick(loc.foundEnemies);
    startCombat(enemyKey, ()=> doScavenge(g, loc, locKey, p));
    return;
  }
  doScavenge(g, loc, locKey, p);
}

function doScavenge(g, loc, locKey, p){
  // gather loot
  let gained = {};
  for (const r in loc.loot){
    const [lo, hi] = loc.loot[r];
    const amt = rint(lo, hi);
    if (amt>0){
      const got = addResource(g, r, amt);
      if (got>0) gained[r] = (gained[r]||0) + got;
    }
  }
  // survivor find
  if (chance(loc.survChance)){
    spawnStranger(g);
  }
  // book chance
  if (locKey==="school" || locKey==="hospital" || locKey==="shelter"){
    if (chance(0.2)){ const k = rint(1,3); g.knowledge += k; pushLog(g, `You found notes worth ${k} knowledge.`, "good"); }
  }

  p.energy -= loc.energy;
  p.hunger -= 6; p.thirst -= 6;
  passPhase(g, loc.time);

  const gainedStr = Object.entries(gained).map(([k,v])=>`+${fmt(v)} ${RESOURCES[k].name}`).join(", ");
  if (gainedStr) pushLog(g, `You returned from ${loc.name}: ${gainedStr}.`, "good");
  else pushLog(g, `You returned from ${loc.name} empty-handed.`, "warn");

  render(); save();
}

// --- Combat ---

let _combat = null;

function startCombat(enemyKey, onWinAfter, onFleeAfter){
  const e = ENEMIES[enemyKey];
  cancelAutoWalk();
  _combat = {
    enemyKey, name:e.name, hp:e.hp, maxHp:e.hp, dmg:e.dmg, danger:e.danger, loot:e.loot,
    onWinAfter, onFleeAfter,
    playerHpStart: G.survivors[0].health,
    log:[]
  };
  showCombatModal();
}

function combatAttack(){
  const c = _combat; if (!c) return;
  const p = G.survivors[0];
  // weapon bonus
  let weaponBonus = 0;
  if (G.resources.weapons >= 1){ weaponBonus = 6; }
  const skill = p.skills.combat || 0;
  const dmg = rint(3,7) + weaponBonus + skill + (p.traits.includes("brave")?2:0);
  c.hp -= dmg;
  c.log.push(`You strike ${c.name} for ${dmg}.`);
  if (G.resources.ammo>=1 && G.resources.weapons>=1 && chance(0.3)){
    G.resources.ammo -= 1;
    const ed = rint(6,12);
    c.hp -= ed;
    c.log.push(`You fire and hit for ${ed}.`);
  }
  if (c.hp<=0){ combatWin(); return; }
  enemyTurn();
}

function combatFlee(){
  const c = _combat; if (!c) return;
  const p = G.survivors[0];
  const fleeChance = 0.4 + (p.traits.includes("quick")?0.2:0) + (p.traits.includes("cowardly")?0.15:0) - c.danger*0.05;
  if (chance(fleeChance)){
    pushLog(G, `You fled from ${c.name}.`, "warn");
    const fa = c.onFleeAfter;
    _combat = null; closeModal();
    p.energy = clamp(p.energy-10,0,100);
    passPhase(G,1);
    if (fa) fa();
    render(); save();
  } else {
    c.log.push(`You failed to flee.`);
    enemyTurn();
  }
}

function enemyTurn(){
  const c = _combat; if (!c) return;
  const p = G.survivors[0];
  const ed = rint(c.dmg[0], c.dmg[1]);
  // armor: 1 leather reduces dmg by 1, capped
  let mitig = 0;
  if (G.resources.leather >= 1) mitig += 2;
  if (G.resources.tools >= 1) mitig += 1;
  const final = Math.max(1, ed - mitig);
  p.health = clamp(p.health - final, 0, p.maxHealth);
  c.log.push(`${c.name} hits you for ${final}.`);
  if (p.health<=0){ combatLose(); return; }
  showCombatModal();
}

function combatWin(){
  const c = _combat; if (!c) return;
  const loot = {};
  for (const r in c.loot){
    const [lo,hi] = c.loot[r]; const amt = rint(lo,hi);
    if (amt>0){ const got = addResource(G, r, amt); if (got>0) loot[r]=got; }
  }
  const lootStr = Object.entries(loot).map(([k,v])=>`+${fmt(v)} ${RESOURCES[k].name}`).join(", ");
  pushLog(G, `You defeated ${c.name}.${lootStr?" Loot: "+lootStr:""}`, "good");
  G.survivors[0].skills.combat = Math.min(20, G.survivors[0].skills.combat + 0.5);
  G.reputation += 0.5;
  const after = c.onWinAfter;
  _combat = null; closeModal();
  if (after) after();
  else { passPhase(G,1); render(); save(); }
}

function combatLose(){
  const c = _combat; if (!c) return;
  pushLog(G, `You were beaten by ${c.name}. You lose resources crawling back.`, "bad");
  // lose resources
  const losses = ["wood","food","water","cloth","metal","weapons"];
  for (const r of losses){ if (G.resources[r] > 0){ const l = Math.ceil(G.resources[r]*0.2); G.resources[r] -= l; } }
  _combat = null; closeModal();
  if (G.survivors[0].health<=0){ removeDead(G); save(); render(); return; }
  passPhase(G,1);
  render(); save();
}

// --- Building ---

function build(buildingId, townX=null, townY=null){
  const g = G;
  const b = BUILDINGS[buildingId]; if (!b) return;
  if (!isUnlocked(g, buildingId)) { pushLog(g,"Not yet researched.","warn"); render(); return; }
  if ((g.buildings[buildingId]?.count||0) >= b.max){ pushLog(g,`${b.name}: max reached.`,"warn"); render(); return; }
  if (!canPay(g, b.cost)){ pushLog(g,`Not enough resources for ${b.name}.`,"warn"); render(); return; }
  if (townX==null || townY==null){
    _buildToPlace = buildingId;
    _activeTab = "town";
    pushLog(g, `Choose a town plot for ${b.name}.`, "info");
    render(); save(); return;
  }
  if (!placeTownBuilding(g, buildingId, townX, townY)){
    pushLog(g, "That town plot is not available.", "warn");
    render(); return;
  }
  pay(g, b.cost);
  if (!g.buildings[buildingId]) g.buildings[buildingId] = {count:0, dmg:0};
  g.buildings[buildingId].count++;
  pushLog(g, `Built ${b.name}.`, "good");
  _buildToPlace = null;
  // building takes one phase of time
  passPhase(g,1);
  render(); save();
}

// --- Knowledge ---

function research(nodeId){
  const g = G;
  const node = KNOWLEDGE.find(n=>n.id===nodeId); if (!node) return;
  if (g.knownNodes[nodeId]) return;
  for (const r of node.req){ if (!g.knownNodes[r]){ pushLog(g, `Missing prerequisite for ${node.name}.`,"warn"); render(); return; } }
  if (g.knowledge < node.cost){ pushLog(g, `Need ${node.cost} knowledge for ${node.name}.`,"warn"); render(); return; }
  g.knowledge -= node.cost;
  g.knownNodes[nodeId] = true;
  pushLog(g, `Researched ${node.name}.`, "good");
  render(); save();
}

// --- Jobs ---

function assignJob(survId, jobKey){
  const g = G;
  const s = survivorById(g, survId); if (!s) return;
  if (s.isChild) return;
  if (s.isPlayer && jobKey!=="none"){ pushLog(g,"You manage things yourself — assign others.","warn"); render(); return; }
  // unassign from previous building slot
  const prev = g.jobs[survId];
  if (prev && JOBS[prev]?.building){
    const bid = JOBS[prev].building;
    if (g.workerAssign[bid]) g.workerAssign[bid] = g.workerAssign[bid].filter(id=>id!==survId);
  }
  if (jobKey==="none"){ g.jobs[survId] = "none"; s.job = "none"; render(); save(); return; }
  if (!jobAvailable(g, jobKey)){ pushLog(g, `No open slot for ${JOBS[jobKey].name}.`,"warn"); render(); return; }
  g.jobs[survId] = jobKey;
  s.job = jobKey;
  const b = JOBS[jobKey].building;
  if (b){
    if (!g.workerAssign[b]) g.workerAssign[b] = [];
    g.workerAssign[b].push(survId);
  }
  pushLog(g, `${s.name} assigned to ${JOBS[jobKey].name}.`,"info");
  render(); save();
}

// --- Survivors / families ---

function spawnStranger(g){
  if (g.survivors.length >= getHousing(g) + 1){
    // arrives but might leave
    if (chance(0.5)){
      pushLog(g,"A stranger arrived but left when they saw no place to stay.","warn");
      return;
    }
  }
  const s = makeSurvivor();
  s.id = g.nextSurvId++;
  // assign id properly
  // (push)
  g.survivors.push(s);
  g.jobs[s.id] = "none";
  pushLog(g, `A survivor named ${s.name} (${s.traits.map(t=>TRAITS[t].label).join(", ")}) joined your camp.`, "good");
  // happiness lift for player
  g.survivors[0].happiness = clamp(g.survivors[0].happiness + 3,0,100);
}

function traderArrives(g){
  // simple trade: give random good deal
  const offers = [
    {give:{wood:10}, get:{food:6}},
    {give:{wood:8}, get:{cloth:6}},
    {give:{food:6}, get:{medicine:2}},
    {give:{metal:6}, get:{tools:2}},
    {give:{herbs:4}, get:{water:6}},
    {give:{cloth:6}, get:{leather:3}},
    {give:{bones:4}, get:{seeds:3}},
    {give:{alcohol:2}, get:{books:1}},
    {give:{charcoal:4}, get:{iron:1}},
  ];
  const offer = pick(offers);
  showModal({
    title:"A Trader Arrives",
    body:`<p>A wanderer offers to trade:</p>
      <p><b>Give:</b> ${Object.entries(offer.give).map(([k,v])=>v+" "+RESOURCES[k].name).join(", ")}<br/>
      <b>Get:</b> ${Object.entries(offer.get).map(([k,v])=>v+" "+RESOURCES[k].name).join(", ")}</p>`,
    buttons:[
      {label:"Accept", primary:true, action:()=>{
        if (!canPay(G, offer.give)){ pushLog(G,"You couldn't fulfill the trade.","warn"); }
        else { pay(G, offer.give); for (const k in offer.get) addResource(G,k,offer.get[k]); pushLog(G,"Trade complete.","good"); G.reputation += 0.5; }
        closeModal(); render(); save();
      }},
      {label:"Decline", action:()=>{ closeModal(); }}
    ]
  });
}

function tryRelationship(g){
  // pair eligible unpartnered adults
  const eligible = adults(g).filter(s=> !s.partnerId && s.health>0 && !s.isChild);
  if (eligible.length < 2) return;
  const a = pick(eligible);
  const others = eligible.filter(s=> s.id!==a.id);
  if (others.length===0) return;
  const b = pick(others);
  // require a roof
  if (getHousing(g) < g.survivors.length) return;
  a.partnerId = b.id; b.partnerId = a.id;
  g.relationships.push({a:a.id, b:b.id, type:"partner"});
  pushLog(g, `${a.name} and ${b.name} have become partners.`, "good");
  a.happiness = clamp(a.happiness+10,0,100); b.happiness = clamp(b.happiness+10,0,100);
}

function birthChild(g, a, b){
  if (g.survivors.length >= getHousing(g)) return;
  const child = makeSurvivor("Child");
  child.isChild = true;
  child.age = 0;
  child.age_ticks = 0;
  child.lastName = (rng()<0.5? a.lastName : b.lastName);
  child.name = `${child.firstName} ${child.lastName}`;
  child.parentIds = [a.id, b.id];
  child.health = 50; child.maxHealth = 60;
  child.skills = {combat:0,building:0,farming:0,medicine:0,crafting:0,hunting:0};
  child.id = g.nextSurvId++;
  g.survivors.push(child);
  g.jobs[child.id] = "none";
  g.relationships.push({a:a.id, b:child.id, type:"parent"});
  g.relationships.push({a:b.id, b:child.id, type:"parent"});
  pushLog(g, `${a.name} and ${b.name} welcomed a child: ${child.name}.`, "good");
  a.happiness = clamp(a.happiness+8,0,100);
  b.happiness = clamp(b.happiness+8,0,100);
}

// --- Threats / events ---

function rollThreats(g){
  const d = settlementDanger(g);
  g.danger = d;
  let raidChance = 0.04 + d * 0.005;
  // walls reduce
  let warning = 0;
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    if (b.effects?.warning) warning += g.buildings[id].count;
  }
  if (warning>0) raidChance -= 0.02 * warning;
  raidChance = clamp(raidChance, 0.01, 0.5);

  if (chance(raidChance)){
    raidEvent(g);
  }
  // disease event
  if (chance((0.02 + g.survivors.length*0.003) * (1 - diseaseResist(g))) && g.resources.water < g.survivors.length){
    const target = pick(g.survivors.filter(s=>!s.diseased));
    if (target){ target.diseased = true; pushLog(g, `${target.isPlayer?"You":target.name} fell ill.`, "bad"); }
  }
  // fire event
  if (chance(0.01) && Object.keys(g.buildings).length > 4){
    const bid = pick(Object.keys(g.buildings).filter(b=>b!=="campfire"));
    if (bid && g.buildings[bid].count>0){
      g.buildings[bid].count = Math.max(0, g.buildings[bid].count - 1);
      pushLog(g, `Fire damaged your ${BUILDINGS[bid].name}.`, "bad");
    }
  }
  // food spoilage if too much
  if (g.resources.food > foodStorageCap(g)*0.9){
    const spoil = Math.ceil(g.resources.food * 0.05);
    g.resources.food = Math.max(0, g.resources.food - spoil);
    pushLog(g, `${spoil} food spoiled.`, "warn");
  }
  // trader random
  if (chance(0.04 + g.reputation*0.002)) traderArrives(g);
  // resource discovery
  if (chance(0.03)){
    const r = pick(["wood","stone","herbs","seeds","metal"]);
    const amt = rint(3,8);
    addResource(g, r, amt);
    pushLog(g, `You discovered ${amt} ${RESOURCES[r].name} nearby.`, "good");
  }
}

function diseaseResist(g){
  let resist = 0;
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    resist += (b.effects?.disease_resist || 0) * g.buildings[id].count;
  }
  return clamp(resist, 0, 0.75);
}

function maybeRandomEvent(g){
  // a few tick-scale events
  const roll = rng();
  if (roll < 0.3){
    // weather effect
    if (chance(0.5)){
      const amt = rint(1,3);
      addResource(g,"dirty_water", amt);
      // pushLog(g,`Light rain. (+${amt} dirty water)`,"info");
    }
  } else if (roll < 0.5){
    // stranger passes by
    if (chance(0.1)) spawnStranger(g);
  } else if (roll < 0.7){
    // worker injured
    if (g.survivors.length > 1 && chance(0.04)){
      const t = pick(nonPlayerAdults(g));
      if (t){
        const inj = rint(5,15);
        t.health = clamp(t.health - inj, 0, t.maxHealth);
        if (t.health < 50) t.injured = true;
        pushLog(g, `${t.name} was injured at work.`, "warn");
      }
    }
  }
}

function raidEvent(g){
  // pick a raid type
  const pool = ["raiders","bandits","wolves","wild_dogs","infected","mutated_animals","warlord_scouts","thieves"];
  // bias toward danger
  const enemyKey = g.danger > 30 ? pick(["raiders","bandits","warlord_scouts","mutated_animals"]) : pick(pool);
  const e = ENEMIES[enemyKey];
  const count = 1 + Math.floor(g.danger / 12);
  // defense values
  let defense = 0;
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    const eff = b.effects || {};
    if (eff.wall) defense += eff.wall * g.buildings[id].count;
    if (eff.safety_per_worker) defense += eff.safety_per_worker * (g.workerAssign[id]?.length || 0);
  }
  // guards fight back
  let attackPower = (e.dmg[0]+e.dmg[1])/2 * count;
  let lossDmg = Math.max(0, attackPower - defense*0.6);

  // weapons in armory help
  if (g.resources.weapons>=2) lossDmg *= 0.8;

  // distribute damage
  let casualties = 0, lostRes = 0;
  // hurt random survivors slightly
  for (let i=0;i<count;i++){
    const t = pick(g.survivors);
    if (!t) continue;
    const dmg = Math.ceil(lossDmg / count) + rint(0,4);
    t.health = clamp(t.health - dmg, 0, t.maxHealth);
    if (t.health<=0 && !t.isPlayer) casualties++;
  }
  // steal/damage resources
  if (enemyKey==="thieves" || enemyKey==="raiders" || enemyKey==="bandits" || enemyKey==="warlord_scouts"){
    const stealList = ["food","water","metal","weapons","ammo","cloth","tools"];
    for (const r of stealList){
      const amt = Math.min(g.resources[r]||0, Math.ceil((g.resources[r]||0)*0.15));
      if (amt>0){ g.resources[r] -= amt; lostRes += amt; }
    }
  }
  // possible building damage
  if (chance(0.4) && Object.keys(g.buildings).length>3){
    const bid = pick(Object.keys(g.buildings).filter(b=>b!=="campfire"));
    if (bid && g.buildings[bid].count>0){
      g.buildings[bid].count = Math.max(0, g.buildings[bid].count - 1);
      pushLog(g, `${BUILDINGS[bid].name} was damaged in the raid.`,"bad");
    }
  }
  pushLog(g, `Raid! ${count} ${e.name}${count>1?"s":""} attacked. ${casualties? casualties+" lost.":""} ${lostRes? lostRes+" supplies stolen.":""}`, "bad");
  for (const s of g.survivors) s.happiness = clamp(s.happiness-5,0,100);
  removeDead(g);
}

// ------------------------- MAP / WORLD ------------------------------

function generateMap(g){
  // Initialize all plains
  const map = [];
  for (let y=0; y<MAP_H; y++){
    const row = [];
    for (let x=0; x<MAP_W; x++){
      row.push({biome:"plains", feature:null, entity:null});
    }
    map.push(row);
  }
  // Random biome blobs
  const blobs = [
    {biome:"forest",      count:7, size:[3,7]},
    {biome:"deep_forest", count:3, size:[2,4]},
    {biome:"mountain",    count:5, size:[3,6]},
    {biome:"hills",       count:6, size:[2,5]},
    {biome:"swamp",       count:3, size:[2,4]},
    {biome:"ruins",       count:6, size:[2,5]},
    {biome:"radio",       count:2, size:[2,4]},
    {biome:"desert",      count:3, size:[3,6]},
    {biome:"snow",        count:2, size:[2,4]},
    {biome:"lake",        count:3, size:[2,3]},
  ];
  for (const b of blobs){
    for (let i=0; i<b.count; i++){
      const x = rint(2, MAP_W-3), y = rint(2, MAP_H-3);
      const size = rint(b.size[0], b.size[1]);
      paintBlob(map, x, y, size, b.biome);
    }
  }
  // River
  let rx = rint(8, MAP_W-8);
  for (let y=0; y<MAP_H; y++){
    if (rx>=0 && rx<MAP_W) map[y][rx].biome = "river";
    if (chance(0.4)) rx += chance(0.5) ? -1 : 1;
    rx = clamp(rx, 1, MAP_W-2);
  }
  // A horizontal road
  let ry = rint(6, MAP_H-6);
  for (let x=0; x<MAP_W; x++){
    if (map[ry][x].biome !== "river") map[ry][x].biome = "road";
    if (chance(0.25)) ry += chance(0.5) ? -1 : 1;
    ry = clamp(ry, 2, MAP_H-3);
  }

  // Place village near center but on a calm biome
  const vx = Math.floor(MAP_W/2);
  const vy = Math.floor(MAP_H/2);
  // Find a passable, non-hazardous tile near center
  let chosen = null;
  for (let r=0; r<8 && !chosen; r++){
    for (let dy=-r; dy<=r && !chosen; dy++){
      for (let dx=-r; dx<=r && !chosen; dx++){
        const x = vx+dx, y = vy+dy;
        if (x<2||y<2||x>=MAP_W-2||y>=MAP_H-2) continue;
        const b = BIOMES[map[y][x].biome];
        if (!b.blocks && !b.hazard && !b.radiation){ chosen = [x,y]; }
      }
    }
  }
  if (!chosen) chosen = [vx,vy];
  g.villageX = chosen[0]; g.villageY = chosen[1];
  g.playerX = g.villageX; g.playerY = g.villageY;
  // Clear village + adjacent tiles to plains and place village marker
  for (let dy=-1; dy<=1; dy++){
    for (let dx=-1; dx<=1; dx++){
      const x = g.villageX+dx, y = g.villageY+dy;
      if (x>=0&&y>=0&&x<MAP_W&&y<MAP_H){
        map[y][x].entity = null;
        map[y][x].feature = null;
        if (BIOMES[map[y][x].biome].blocks || BIOMES[map[y][x].biome].hazard) map[y][x].biome = "plains";
      }
    }
  }
  map[g.villageY][g.villageX].biome = "village";

  g.map = map;
  g.explored = {};

  // Sprinkle features
  populateFeatures(g, 220);
  // Sprinkle entities
  populateEntities(g, 70);
  // Place the unique Old Sage within sight of the village
  placeSage(g);

  // Reveal area around village
  for (let dy=-2; dy<=2; dy++)
    for (let dx=-2; dx<=2; dx++){
      const x=g.villageX+dx, y=g.villageY+dy;
      if (inBounds(x,y)) g.explored[x+","+y] = true;
    }
}

function paintBlob(map, cx, cy, size, biome){
  for (let y=Math.max(0,cy-size); y<=Math.min(MAP_H-1,cy+size); y++){
    for (let x=Math.max(0,cx-size); x<=Math.min(MAP_W-1,cx+size); x++){
      const d = Math.hypot(x-cx, y-cy);
      if (d <= size && rng() < (1 - d/size)){
        map[y][x].biome = biome;
      }
    }
  }
}

function inBounds(x,y){ return x>=0 && y>=0 && x<MAP_W && y<MAP_H; }

function tilesByBiome(g){
  const idx = {};
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++){
    const b = g.map[y][x].biome;
    if (!idx[b]) idx[b] = [];
    idx[b].push([x,y]);
  }
  return idx;
}

function populateFeatures(g, target){
  const featureKeys = Object.keys(MAP_FEATURES);
  let placed = 0, tries = 0;
  while (placed < target && tries < target*30){
    tries++;
    const fk = pick(featureKeys);
    const f = MAP_FEATURES[fk];
    if (f.rare && !chance(0.2)) continue;
    const bk = pick(f.biomes);
    // Find a tile of that biome
    const x = rint(0, MAP_W-1), y = rint(0, MAP_H-1);
    if (!inBounds(x,y)) continue;
    const t = g.map[y][x];
    if (t.biome !== bk) continue;
    if (t.feature || t.entity) continue;
    // Don't place on village or directly adjacent
    if (Math.abs(x-g.villageX)<=1 && Math.abs(y-g.villageY)<=1) continue;
    t.feature = {type:fk, charges:f.charges};
    placed++;
  }
}

function populateEntities(g, target){
  const entityKeys = Object.keys(MAP_ENTITIES);
  let placed = 0, tries = 0;
  while (placed < target && tries < target*40){
    tries++;
    const ek = pick(entityKeys);
    const e = MAP_ENTITIES[ek];
    if (e.unique) continue;
    const bk = pick(e.biomes||["plains"]);
    const x = rint(0, MAP_W-1), y = rint(0, MAP_H-1);
    if (!inBounds(x,y)) continue;
    const t = g.map[y][x];
    if (t.biome !== bk) continue;
    if (t.feature || t.entity) continue;
    if (BIOMES[t.biome].blocks) continue;
    if (Math.abs(x-g.villageX)<=2 && Math.abs(y-g.villageY)<=2) continue;
    t.entity = {type:ek};
    placed++;
  }
}

// Place the unique Old Sage NPC a few tiles from the village on a passable tile.
// Idempotent: if a sage is already placed (per g.sageX/sageY), do nothing.
function placeSage(g){
  if (g.sageX!=null && g.sageY!=null
      && inBounds(g.sageX, g.sageY)
      && g.map[g.sageY][g.sageX].entity
      && g.map[g.sageY][g.sageX].entity.type==="sage_npc"){
    return;
  }
  // Search outward from the village for a safe, passable, empty tile.
  for (let r=3; r<=8; r++){
    const candidates = [];
    for (let dy=-r; dy<=r; dy++){
      for (let dx=-r; dx<=r; dx++){
        if (Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;
        const x = g.villageX+dx, y = g.villageY+dy;
        if (!inBounds(x,y)) continue;
        const t = g.map[y][x];
        const b = BIOMES[t.biome];
        if (b.blocks || b.hazard || b.radiation) continue;
        if (t.entity || t.feature) continue;
        if (x===g.villageX && y===g.villageY) continue;
        candidates.push([x,y]);
      }
    }
    if (candidates.length){
      const [x,y] = pick(candidates);
      g.map[y][x].entity = {type:"sage_npc"};
      g.sageX = x; g.sageY = y;
      return;
    }
  }
  // Fallback: drop him directly east of the village, clearing whatever was there.
  let x = clamp(g.villageX+3, 1, MAP_W-2), y = g.villageY;
  g.map[y][x].feature = null;
  g.map[y][x].entity = {type:"sage_npc"};
  if (BIOMES[g.map[y][x].biome].blocks) g.map[y][x].biome = "plains";
  g.sageX = x; g.sageY = y;
}

function computeVisible(g){
  const radius = (g.phase===3) ? VISION_NIGHT : VISION_DAY;
  const vis = {};
  for (let dy=-radius; dy<=radius; dy++){
    for (let dx=-radius; dx<=radius; dx++){
      if (dx*dx + dy*dy > radius*radius) continue;
      const x = g.playerX+dx, y = g.playerY+dy;
      if (!inBounds(x,y)) continue;
      vis[x+","+y] = true;
      g.explored[x+","+y] = true;
    }
  }
  // Village area always at least known
  for (let dy=-1; dy<=1; dy++)
    for (let dx=-1; dx<=1; dx++){
      const x=g.villageX+dx, y=g.villageY+dy;
      if (inBounds(x,y)) g.explored[x+","+y] = true;
    }
  return vis;
}

function isAdjacentToVillage(g){
  return Math.abs(g.playerX-g.villageX)<=1 && Math.abs(g.playerY-g.villageY)<=1;
}

// Player movement
let _autoWalk = null;

function tryMove(g, dx, dy){
  const nx = g.playerX + dx, ny = g.playerY + dy;
  if (!inBounds(nx,ny)) return false;
  const t = g.map[ny][nx];
  const b = BIOMES[t.biome];
  if (b.blocks){
    pushLog(g, `Cannot cross ${b.name}.`,"warn");
    return false;
  }
  const p = g.survivors[0];
  if (p.health<=0) return false;
  const cost = Math.ceil(b.cost * movementPenalty(p));
  if (p.energy < cost){
    pushLog(g, movementPenalty(p)>1 ? "Cold, hunger, or thirst slows you too much to keep walking." : "Too tired to keep walking.","warn");
    return false;
  }
  g.playerX = nx; g.playerY = ny;
  p.energy = clamp(p.energy - cost, 0, 100);
  if (b.cold) p.warmth = clamp(p.warmth - 4, 0, 100);
  g.stepAccum += cost;
  // small hunger/thirst drift
  if (chance(0.5)) p.hunger = clamp(p.hunger-1,0,100);
  if (chance(0.5)) p.thirst = clamp(p.thirst-1,0,100);

  // Random biome hazard (radiation, swamp)
  if (b.hazard && chance(b.hazard)){
    const dmg = rint(2,6);
    p.health = clamp(p.health - dmg, 0, p.maxHealth);
    pushLog(g, `The ${b.name.toLowerCase()} hurts you. (-${dmg} HP)`, "bad");
    if (b.radiation && chance(0.2)){ p.diseased = true; pushLog(g,"Radiation sickness sets in.","bad"); }
    if (p.health<=0){ removeDead(g); return true; }
  }

  // Trigger encounter on the new tile
  encounterTile(g, nx, ny);

  // Tick the world if enough steps
  while (g.stepAccum >= STEP_PER_PHASE){
    g.stepAccum -= STEP_PER_PHASE;
    advanceOnePhase(g);
  }

  // If reached village area, recruit followers
  if (isAdjacentToVillage(g) && g.followers.length > 0){
    recruitFollowersAtVillage(g);
  }

  return true;
}

function movementPenalty(p){
  let mult = 1;
  if (p.warmth < 30) mult += 0.5;
  if (p.warmth < 15) mult += 0.5;
  if (p.hunger < 20) mult += 0.35;
  if (p.thirst < 20) mult += 0.5;
  if (p.injured) mult += 0.25;
  if (p.diseased) mult += 0.25;
  return mult;
}

function recruitFollowersAtVillage(g){
  const incoming = g.followers.slice();
  g.followers = [];
  for (const s of incoming){
    s.id = g.nextSurvId++;
    g.survivors.push(s);
    g.jobs[s.id] = "none";
    pushLog(g, `${s.name} reached the campfire and joined your settlement.`,"good");
  }
  // small happiness bump
  g.survivors[0].happiness = clamp(g.survivors[0].happiness + 5, 0, 100);
}

function startAutoWalk(tx, ty){
  cancelAutoWalk();
  if (G.playerX===tx && G.playerY===ty) return;
  const path = findAutoPath(G, tx, ty);
  if (!path.length){
    pushLog(G, "No known passable route there.", "warn");
    render(); save();
    return;
  }
  _autoWalk = {tx, ty, path, paused:false};
  stepAutoWalk();
}

function cancelAutoWalk(){
  if (_autoWalk && _autoWalk.timer) clearTimeout(_autoWalk.timer);
  _autoWalk = null;
}

function stepAutoWalk(){
  const w = _autoWalk; if (!w) return;
  // stop if encounter modal is open
  if (document.getElementById("modal-root").firstChild){ cancelAutoWalk(); return; }
  if (G.playerX===w.tx && G.playerY===w.ty){ cancelAutoWalk(); render(); return; }
  if (!w.path || !w.path.length){ cancelAutoWalk(); render(); return; }
  const next = w.path.shift();
  const dxRaw = Math.sign(next[0] - G.playerX);
  const dyRaw = Math.sign(next[1] - G.playerY);
  const hpBefore = G.survivors[0].health;
  let moved = tryMoveQuiet(G, dxRaw, dyRaw);
  if (!moved){ cancelAutoWalk(); render(); return; }
  // Stop if damage taken or low energy
  if (G.survivors[0].health < hpBefore){ cancelAutoWalk(); pushLog(G, "You halt — you've been hurt.","warn"); render(); save(); return; }
  if (G.survivors[0].energy < 5){ cancelAutoWalk(); pushLog(G,"You stop, exhausted.","warn"); render(); save(); return; }
  render();
  save();
  _autoWalk.timer = setTimeout(stepAutoWalk, 70);
}

function findAutoPath(g, tx, ty){
  if (!inBounds(tx,ty)) return [];
  if (!g.explored[tx+","+ty]) return [];
  if (BIOMES[g.map[ty][tx].biome].blocks) return [];
  const start = g.playerX+","+g.playerY;
  const goal = tx+","+ty;
  const queue = [[g.playerX, g.playerY]];
  const came = {[start]: null};
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for (let qi=0; qi<queue.length; qi++){
    const [x,y] = queue[qi];
    if (x===tx && y===ty) break;
    for (const [dx,dy] of dirs){
      const nx=x+dx, ny=y+dy, key=nx+","+ny;
      if (!inBounds(nx,ny) || came[key]!==undefined) continue;
      if (!g.explored[key]) continue;
      const b = BIOMES[g.map[ny][nx].biome];
      if (b.blocks) continue;
      came[key] = [x,y];
      queue.push([nx,ny]);
    }
  }
  if (came[goal]===undefined) return [];
  const path = [];
  let cur = [tx,ty];
  while (cur){
    path.push(cur);
    cur = came[cur[0]+","+cur[1]];
  }
  path.reverse();
  path.shift();
  return path;
}

// like tryMove but suppresses already-handled modal popping mid-step
function tryMoveQuiet(g, dx, dy){
  return tryMove(g, dx, dy);
}

// --- Encounters ---

function encounterTile(g, x, y){
  const t = g.map[y][x];
  if (t.entity){
    const e = MAP_ENTITIES[t.entity.type];
    if (e){
      const dormant = e.nightOnly && g.phase!==3;
      if (!dormant){
        if (e.hostile){
          startCombat(e.enemy, ()=>{
            t.entity = null;
            passPhase(G,1);
            render(); save();
          }, ()=>{
            render(); save();
          });
          return;
        }
        if (e.friendly){
          openFriendlyDialog(g, e, x, y);
          return;
        }
      }
    }
  }
  if (t.feature){
    handleFeature(g, t, x, y);
  }
}

function handleFeature(g, t, x, y){
  const f = MAP_FEATURES[t.feature.type];
  if (!f) return;
  const p = g.survivors[0];

  // Hidden hazard: trigger immediately
  if (f.hidden){
    if (f.damage){
      const d = rint(f.damage[0], f.damage[1]);
      p.health = clamp(p.health - d, 0, p.maxHealth);
      pushLog(g, `${f.icon} ${f.name}! You take ${d} damage.`, "bad");
    }
    if (f.energyLoss){ p.energy = clamp(p.energy - f.energyLoss, 0, 100); }
    t.feature = null;
    return;
  }

  // Always-on hazards (no charges or many charges)
  if (f.damage && !f.loot && !f.event){
    const d = rint(f.damage[0], f.damage[1]);
    p.health = clamp(p.health - d, 0, p.maxHealth);
    pushLog(g, `${f.icon} ${f.name}: -${d} HP.`,"bad");
    if (f.energyLoss) p.energy = clamp(p.energy - f.energyLoss, 0, 100);
    if (f.curse && chance(0.3)){ p.diseased = true; pushLog(g,`You contracted illness.`,"bad"); }
    if (f.charges < 99) { t.feature.charges--; if (t.feature.charges<=0) t.feature = null; }
    return;
  }
  if (f.energyLoss && !f.loot && !f.event){
    const e = f.energyLoss;
    p.energy = clamp(p.energy - e, 0, 100);
    pushLog(g, `${f.icon} ${f.name}: -${e} energy.`,"warn");
    if (f.charges < 99) { t.feature.charges--; if (t.feature.charges<=0) t.feature = null; }
    return;
  }

  // Events
  if (f.event){
    triggerEvent(g, f, t, x, y);
    return;
  }

  // Underground entrances stay on the map and open a repeatable expedition choice.
  if (f.underground){
    openUndergroundDialog(g, f.underground, t, x, y);
    return;
  }

  // Normal loot interaction — prompt or auto?
  // Auto-loot for simplicity, also apply special effects.
  const got = {};
  if (f.loot){
    for (const r in f.loot){
      const [lo,hi] = f.loot[r];
      const amt = rint(lo, hi);
      if (amt>0){
        const gained = addResource(g, r, amt);
        if (gained>0) got[r] = (got[r]||0)+gained;
      }
    }
  }
  if (f.knowledge){
    const k = rint(f.knowledge[0], f.knowledge[1]);
    g.knowledge += k;
    pushLog(g, `You learned from the ${f.name}. +${k} knowledge.`,"good");
  }
  if (f.heal){ p.health = clamp(p.health + f.heal, 0, p.maxHealth); }
  if (f.warmth){ p.warmth = clamp(p.warmth + f.warmth, 0, 100); }
  if (f.sting){
    const d = rint(2,5);
    p.health = clamp(p.health - d, 0, p.maxHealth);
    pushLog(g, `Bee stings! -${d} HP.`,"warn");
  }
  if (f.damage){
    const d = rint(f.damage[0], f.damage[1]);
    p.health = clamp(p.health - d, 0, p.maxHealth);
    pushLog(g, `${f.name} hurts you. -${d} HP.`,"warn");
  }
  if (f.curse && chance(0.3)){ p.diseased = true; pushLog(g,`You feel sick.`,"bad"); }

  // Energy cost for searching
  p.energy = clamp(p.energy - 3, 0, 100);

  const gainedStr = Object.entries(got).map(([k,v])=>`+${fmt(v)} ${RESOURCES[k].name}`).join(", ");
  if (gainedStr) pushLog(g, `${f.icon} ${f.name}: ${gainedStr}.`,"good");
  else if (!f.knowledge && !f.heal) pushLog(g, `${f.icon} ${f.name}: nothing useful.`,"info");

  // Possible enemy popping out
  if (f.enemyChance && chance(f.enemyChance)){
    const ek = pick(["wolves","infected","bears","forest_beasts","mutated_animals","cultists"]);
    pushLog(g, `Something stirs in the dark!`,"bad");
    startCombat(ek, ()=>{ render(); save(); });
  }

  if (f.charges < 99){
    t.feature.charges--;
    if (t.feature.charges <= 0) t.feature = null;
  }
}

function triggerEvent(g, f, t, x, y){
  const p = g.survivors[0];
  switch (f.event){
    case "shrine":{
      if (chance(0.5)){
        const k = rint(2,5); g.knowledge += k;
        pushLog(g, `The shrine grants you insight. +${k} knowledge.`,"good");
      } else {
        const dmg = rint(3,8);
        p.health = clamp(p.health - dmg, 0, p.maxHealth);
        p.morale = clamp(p.morale - 10, 0, 100);
        pushLog(g, `The shrine drains you. -${dmg} HP.`,"bad");
      }
      break;
    }
    case "radio":{
      // reveal a wide area
      revealArea(g, x, y, 7);
      pushLog(g, `The radio crackles weather and warnings — area revealed.`,"info");
      break;
    }
    case "music":{
      p.happiness = clamp(p.happiness + 15, 0, 100);
      pushLog(g, `The melody lifts your spirits. (+15 happiness)`,"good");
      break;
    }
    case "cache":{
      const items = ["food","water","cloth","tools","medicine","ammo","weapons"];
      const got = {};
      for (let i=0;i<3;i++){
        const r = pick(items); const amt = rint(1,3);
        const gain = addResource(g,r,amt);
        got[r] = (got[r]||0)+gain;
      }
      pushLog(g,`Cache opened: ${Object.entries(got).map(([k,v])=>'+'+fmt(v)+' '+RESOURCES[k].name).join(", ")}.`,"good");
      break;
    }
    case "glow":{
      if (chance(0.5)){
        const k = rint(3,6); g.knowledge += k;
        pushLog(g,`The lights show you something. +${k} knowledge.`,"good");
      } else {
        p.diseased = true;
        pushLog(g,`You linger too long. You feel sickly.`,"bad");
      }
      break;
    }
    case "map":{
      revealArea(g, x, y, 10);
      pushLog(g,`The fragment reveals a wider area.`,"info");
      break;
    }
    case "signal":{
      // chance for survivor to be nearby
      if (chance(0.5)){
        const friendlies = ["wanderer_npc","hunter_friendly","scholar_npc","mechanic_npc","doctor_npc"];
        placeNearby(g, x, y, friendlies);
        pushLog(g,`Someone responded to the old signal. A figure approaches in the distance.`,"info");
      } else {
        pushLog(g,`No one answered.`,"info");
      }
      break;
    }
    case "grave":{
      const got = addResource(g,"bones",rint(2,4));
      if (got>0) pushLog(g,`You collect bones from the graveyard. (+${got})`,"info");
      if (chance(0.25)){ p.morale = clamp(p.morale-10,0,100); pushLog(g,"The silence weighs on you.","warn"); }
      break;
    }
  }
  t.feature = null;
}

function openUndergroundDialog(g, siteKey, tile, x, y){
  const site = UNDERGROUND_SITES[siteKey];
  if (!site) return;
  const p = g.survivors[0];
  showModal({
    title:`${site.icon} ${site.name}`,
    body:`<p>${site.desc}</p><p class="muted">Underground trips cost energy and time. Deeper routes offer better loot, but may hurt you or trigger combat.</p><p>Energy: <b>${Math.round(p.energy)}/100</b></p>`,
    buttons:[
      {label:`${site.shallow.label} (${site.shallow.energy} energy)`, primary:true, action:()=> undergroundExplore(siteKey, "shallow", tile, x, y)},
      {label:`${site.deep.label} (${site.deep.energy} energy)`, action:()=> undergroundExplore(siteKey, "deep", tile, x, y)},
      {label:"Stay outside", action:()=>{ closeModal(); render(); }}
    ]
  });
}

function undergroundExplore(siteKey, depth, tile, x, y){
  const site = UNDERGROUND_SITES[siteKey];
  const route = site?.[depth];
  if (!site || !route) return;
  const p = G.survivors[0];
  if (p.energy < route.energy){
    pushLog(G, `Too exhausted to enter ${site.name}.`, "warn");
    closeModal(); render(); save();
    return;
  }
  closeModal();
  cancelAutoWalk();
  p.energy = clamp(p.energy - route.energy, 0, 100);
  p.hunger = clamp(p.hunger - Math.ceil(route.energy/5), 0, 100);
  p.thirst = clamp(p.thirst - Math.ceil(route.energy/5), 0, 100);
  pushLog(G, `You enter ${site.name}: ${route.label.toLowerCase()}.`, "info");

  const finish = ()=> finishUndergroundExplore(siteKey, depth, tile, x, y);
  if (chance(route.danger)){
    startCombat(pick(route.enemies), finish, ()=>{
      passPhase(G, 1);
      pushLog(G, `You stumble back out of ${site.name}.`, "warn");
      render(); save();
    });
    return;
  }
  finish();
}

function finishUndergroundExplore(siteKey, depth, tile, x, y){
  const site = UNDERGROUND_SITES[siteKey];
  const route = site?.[depth];
  if (!site || !route) return;
  const p = G.survivors[0];
  const got = {};
  for (const r in route.loot || {}){
    const [lo, hi] = route.loot[r];
    const amt = rint(lo, hi);
    if (amt>0){
      const gained = addResource(G, r, amt);
      if (gained>0) got[r] = (got[r]||0) + gained;
    }
  }
  if (route.damage && chance(depth==="deep" ? 0.55 : 0.25)){
    const d = rint(route.damage[0], route.damage[1]);
    p.health = clamp(p.health - d, 0, p.maxHealth);
    if (p.health < 50) p.injured = true;
    pushLog(G, `${site.name} bites back. -${d} HP.`, "warn");
    if (p.health<=0){ removeDead(G); render(); save(); return; }
  }
  if (route.curse && chance(0.25)){
    p[route.curse] = true;
    pushLog(G, `The filth below leaves you ${route.curse}.`, "bad");
  }
  if (chance(depth==="deep" ? 0.35 : 0.15)){
    const k = rint(1, depth==="deep" ? 3 : 2);
    G.knowledge += k;
    pushLog(G, `Old markings underground teach you something. +${k} knowledge.`, "good");
  }
  passPhase(G, route.time);
  const gainedStr = Object.entries(got).map(([k,v])=>`+${fmt(v)} ${RESOURCES[k].name}`).join(", ");
  pushLog(G, `${site.icon} ${site.name}: ${gainedStr || "nothing useful"}.`, gainedStr ? "good" : "info");
  if (tile?.feature && tile.feature.charges < 99){
    tile.feature.charges--;
    if (tile.feature.charges<=0) tile.feature = null;
  }
  render(); save();
}

function revealArea(g, cx, cy, r){
  for (let dy=-r; dy<=r; dy++)
    for (let dx=-r; dx<=r; dx++){
      if (dx*dx+dy*dy>r*r) continue;
      const x=cx+dx, y=cy+dy;
      if (inBounds(x,y)) g.explored[x+","+y] = true;
    }
}

function placeNearby(g, cx, cy, entityTypes){
  for (let r=1; r<5; r++){
    for (let dy=-r; dy<=r; dy++){
      for (let dx=-r; dx<=r; dx++){
        const x = cx+dx, y = cy+dy;
        if (!inBounds(x,y)) continue;
        const t = g.map[y][x];
        if (t.feature || t.entity) continue;
        if (BIOMES[t.biome].blocks) continue;
        const ek = pick(entityTypes);
        const e = MAP_ENTITIES[ek];
        // Don't require strict biome match here — they're heading to player
        t.entity = {type:ek};
        return [x,y];
      }
    }
  }
  return null;
}

// Daily map refresh — restock some features and entities
function refreshMapDaily(g){
  if (!g.map) return;
  // Sometimes regrow resource nodes
  for (let i=0; i<10; i++){
    const x = rint(0, MAP_W-1), y = rint(0, MAP_H-1);
    const t = g.map[y][x];
    if (t.feature || t.entity) continue;
    if (BIOMES[t.biome].blocks) continue;
    // pick a renewable feature compatible with this biome
    const candidates = [];
    for (const k in MAP_FEATURES){
      const f = MAP_FEATURES[k];
      if (f.biomes.includes(t.biome) && !f.hidden && !f.rare && f.loot) candidates.push(k);
    }
    if (!candidates.length) continue;
    const fk = pick(candidates);
    t.feature = {type:fk, charges:MAP_FEATURES[fk].charges};
  }
  // Occasional new wandering entities
  for (let i=0; i<3; i++){
    if (!chance(0.6)) continue;
    const x = rint(0, MAP_W-1), y = rint(0, MAP_H-1);
    const t = g.map[y][x];
    if (t.feature || t.entity || BIOMES[t.biome].blocks) continue;
    if (Math.abs(x-g.villageX)<=3 && Math.abs(y-g.villageY)<=3) continue;
    // mostly hostile to keep pressure
    const pool = chance(0.4) ? Object.keys(MAP_ENTITIES).filter(k=>MAP_ENTITIES[k].friendly)
                              : Object.keys(MAP_ENTITIES).filter(k=>MAP_ENTITIES[k].hostile);
    const fits = pool.filter(k=>(MAP_ENTITIES[k].biomes||[]).includes(t.biome));
    if (!fits.length) continue;
    t.entity = {type:pick(fits)};
  }
}

  const e = document.createElement(tag);

}

function estimateDailyDelta(g){
  const d = {};
  const add = (k,v)=>{ d[k] = (d[k]||0) + v; };
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    const count = g.buildings[id].count;
    const assigned = g.workerAssign[id] || [];
    const eff = b.effects || {};
    if (eff.produce) for (const r in eff.produce) add(r, eff.produce[r] * count);
    if (eff.produce_per_worker) for (const r in eff.produce_per_worker) add(r, eff.produce_per_worker[r] * assigned.length * workerSkillBonus(g, id, assigned));
    if (eff.consume) for (const r in eff.consume) add(r, -eff.consume[r] * count);
    if (eff.convert && assigned.length){
      const runs = (eff.convert.perWorker || 1) * assigned.length;
      for (const r in eff.convert.from) add(r, -eff.convert.from[r] * runs);
      for (const r in eff.convert.to) add(r, eff.convert.to[r] * runs);
    }
    if (eff.knowledge) add("knowledge", eff.knowledge * count);
    if (eff.knowledge_per_worker) add("knowledge", eff.knowledge_per_worker * assigned.length);
  }
  for (const s of g.survivors){
    if (!s || s.isPlayer || s.isChild || s.health<=0) continue;
    const jobKey = g.jobs[s.id] || s.job || "none";
    const job = JOBS[jobKey];
    if (!job || job.building) continue;
    const boost = workerJobBonus(s, jobKey);
    for (const r in job.output || {}) add(r, job.output[r] * boost);
  }
  const adultsCount = adults(g).filter(s=>s.health>0).length;
  const childCount = children(g).filter(s=>s.health>0).length;
  add("food", -(adultsCount * 0.65 + childCount * 0.35));
  add("water", -(adultsCount * 0.8 + childCount * 0.45));
  if (g.buildings.campfire?.count) add("wood", -1);
  add("knowledge", 0.5 + g.survivors.length * 0.05);
  return d;
}

function renderMapTab(root){
  const g = G;
  const wrap = el("div","map-wrap");

  // Controls
  const ctrls = el("div","map-controls");
  const p = g.survivors[0];
  ctrls.innerHTML = `<span><b>Move:</b> WASD / Arrows · <b>Click</b> a tile to walk · Walk into entities to interact</span>
    <span class="legend">·  Energy: ${Math.round(p.energy)}/100  ·  Phase: ${PHASES[g.phase]}  ·  Vision: ${(g.phase===3?VISION_NIGHT:VISION_DAY)} tiles</span>`;
  wrap.appendChild(ctrls);

  // Followers strip
  if (g.followers.length>0){
    const fs = el("div","followers-strip");
    fs.innerHTML = `<b>Following:</b> ` + g.followers.map(s=>`<span class="ftag" title="${s.traits.map(t=>TRAITS[t].label).join(', ')}">${s.isChild?"👶 ":""}${s.name}${s.health<50?' 🩹':''}</span>`).join(" ") +
      `<span class="muted">— bring them next to the campfire 🔥 to recruit.</span>`;
    wrap.appendChild(fs);
  }

  // The grid (viewport centered on player)
  const visible = computeVisible(g);
  const halfW = Math.floor(VIEW_W/2), halfH = Math.floor(VIEW_H/2);
  const minX = clamp(g.playerX - halfW, 0, MAP_W - VIEW_W);
  const minY = clamp(g.playerY - halfH, 0, MAP_H - VIEW_H);

  const grid = el("div","map-grid");
  grid.style.gridTemplateColumns = `repeat(${VIEW_W}, 24px)`;
  grid.style.gridTemplateRows = `repeat(${VIEW_H}, 24px)`;

  for (let vy=0; vy<VIEW_H; vy++){
    for (let vx=0; vx<VIEW_W; vx++){
      const x = minX+vx, y = minY+vy;
      const key = x+","+y;
      const tile = g.map[y][x];
      const isVisible = !!visible[key];
      const isExplored = !!g.explored[key];
      const biome = BIOMES[tile.biome];

      const cell = el("div","tile");
      if (!isExplored) cell.classList.add("unseen");
      else if (!isVisible) cell.classList.add("fog");

      if (isExplored){
        cell.style.background = biome.bg;
        cell.style.color = biome.fg;
        // Biome char (lightly drawn)
        const b = document.createElement("span"); b.className = "biome"; b.textContent = biome.icon; cell.appendChild(b);

        if (isVisible){
          // Feature
          if (tile.feature){
            const f = MAP_FEATURES[tile.feature.type];
            if (f && !f.hidden){
              const fe = document.createElement("span"); fe.className = "feat"; fe.textContent = f.icon;
              cell.title = `${f.name} — ${f.desc}`;
              cell.appendChild(fe);
            }
          }
          if (tile.entity){
            const ent = MAP_ENTITIES[tile.entity.type];
            if (ent){
              // Night stalkers only visible at night
              if (!ent.nightOnly || g.phase===3){
                const en = document.createElement("span"); en.className = "ent"; en.textContent = ent.icon;
                cell.title = `${ent.name}${ent.hostile?" (hostile)":""}`;
                cell.appendChild(en);
                if (Math.abs(x-g.playerX)<=1 && Math.abs(y-g.playerY)<=1){
                  cell.classList.add(ent.hostile?"hostile-adj":"friendly-adj");
                }
              }
            }
          }
        }
      }

      // Village marker
      if (x===g.villageX && y===g.villageY){
        cell.classList.add("village-tile");
        if (isExplored){
          const v = document.createElement("span"); v.className = "feat"; v.textContent = "🔥"; cell.appendChild(v);
          cell.title = "Your campfire and settlement";
        }
      }
      // Player marker
      if (x===g.playerX && y===g.playerY){
        cell.classList.add("player-tile");
        const pl = document.createElement("span"); pl.className = "pl"; pl.textContent = "🧑";
        cell.appendChild(pl);
        if (g.followers.length>0){
          const fol = document.createElement("span"); fol.className = "fol"; fol.textContent = "+"+g.followers.length;
          cell.appendChild(fol);
        }
      }
      // Click handler
      cell.onclick = ()=>{
        if (x===g.playerX && y===g.playerY) return;
        if (!isExplored) return;
        startAutoWalk(x,y);
      };
      grid.appendChild(cell);
    }
  }
  wrap.appendChild(grid);

  // Bottom info: current tile / nearby
  const info = el("div","card");
  const here = g.map[g.playerY][g.playerX];
  const bb = BIOMES[here.biome];
  let info_html = `<h3>📍 ${bb.name} (${g.playerX},${g.playerY})</h3>`;
  if (isAdjacentToVillage(g)) info_html += `<div class="good">You are at your settlement. Followers will join here.</div>`;
  info_html += `<div class="muted">Nearby:</div>`;
  const nearby = [];
  for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++){
    const x=g.playerX+dx, y=g.playerY+dy;
    if (!inBounds(x,y)) continue;
    if (dx===0 && dy===0) continue;
    const t = g.map[y][x];
    if (!g.explored[x+","+y]) continue;
    if (t.feature && !MAP_FEATURES[t.feature.type].hidden){
      const f = MAP_FEATURES[t.feature.type];
      nearby.push(`${f.icon} ${f.name}`);
    }
    if (t.entity){
      const e = MAP_ENTITIES[t.entity.type];
      if (e && (!e.nightOnly || g.phase===3)) nearby.push(`${e.icon} ${e.name}${e.hostile?" ⚠":""}`);
    }
  }
  info_html += nearby.length ? `<div>${nearby.join(" · ")}</div>` : `<div class="dim">Nothing of note.</div>`;
  info.innerHTML = info_html;
  wrap.appendChild(info);

  // Biome legend
  const legend = el("div","biome-key");
  legend.innerHTML = Object.values(BIOMES).map(b=>`<span><i style="background:${b.bg}"></i>${b.name}</span>`).join("");
  wrap.appendChild(legend);

  root.appendChild(wrap);
}

  const cx = Math.floor(TOWN_W/2), cy = Math.floor(TOWN_H/2);
  for (let y=0; y<TOWN_H; y++){
    for (let x=0; x<TOWN_W; x++){
      const slot = g.town[y][x];
      const cell = el("div","town-tile " + (slot ? "occupied" : "empty"));
      if (x===cx && y===cy) cell.classList.add("center");
      if (slot){
        const b = BUILDINGS[slot.building];
        if (b?.effects?.wall) cell.classList.add("wall");
        cell.innerHTML = `<span title="${b?.name || slot.building}">${b?.icon || "?"}</span>`;
        cell.title = b ? `${b.name}: ${b.desc}` : slot.building;
      } else {
        cell.title = _buildToPlace ? `Place ${BUILDINGS[_buildToPlace].name}` : "Empty plot";
        cell.onclick = ()=>{
          if (!_buildToPlace){ pushLog(G,"Select a building from the Build tab first.","info"); render(); return; }
          build(_buildToPlace, x, y);
        };
      }
      grid.appendChild(cell);
    }
  }
  wrap.appendChild(grid);
  const built = el("div","card");
  const placed = {};
  for (let y=0; y<TOWN_H; y++) for (let x=0; x<TOWN_W; x++){
    const id = g.town[y][x]?.building;
    if (id) placed[id] = (placed[id]||0)+1;
  }
  built.innerHTML = `<h3>Placed Structures</h3>` + Object.entries(placed).map(([id,n])=>`${BUILDINGS[id]?.icon||""} ${BUILDINGS[id]?.name||id}: <b>${n}</b>`).join(" · ");
  wrap.appendChild(built);
  root.appendChild(wrap);
}

function renderBuildTab(root){
  const g = G;
  const c = el("div","card");
  c.innerHTML = `<h3>🏗 Construct Buildings</h3><div class="muted">Unlock more by researching knowledge.</div>`;
  // categories
  const cats = {};
  for (const id in BUILDINGS){
    const b = BUILDINGS[id];
    if (!cats[b.cat]) cats[b.cat] = [];
    cats[b.cat].push(id);
  }
  for (const cat of Object.keys(cats)){
    const h = el("h4","muted","— "+cat+" —");
    c.appendChild(h);
    const grid = el("div","grid2");
    for (const id of cats[cat]){
      const b = BUILDINGS[id];
      const built = g.buildings[id]?.count || 0;
      const unlocked = isUnlocked(g, id);
      const item = el("div","item");
      item.innerHTML = `<div class="head"><span class="name">${b.icon} ${b.name}</span> <span class="meta">${built}/${b.max}</span></div>
        <div class="desc">${b.desc}</div>
        <div class="cost">Cost: ${costString(b.cost) || "Free"}</div>
        ${b.workers?`<div class="effect">Workers: ${b.workers}</div>`:""}`;
      const btn = el("button","primary small", _buildToPlace===id ? "Selected" : "Place");
      btn.disabled = !unlocked || !canPay(g,b.cost) || built>=b.max;
      btn.onclick = ()=> build(id);
      item.appendChild(btn);
      if (!unlocked){
        const lk = el("div","dim","🔒 Locked — requires " + unlockRequirement(g, id));
        item.appendChild(lk);
      }
      grid.appendChild(item);
    }
    c.appendChild(grid);
  }
  root.appendChild(c);
}

function unlockRequirement(g, buildingId){
  const nodes = KNOWLEDGE.filter(n => (n.unlock?.buildings||[]).includes(buildingId));
  if (!nodes.length) return "research";
  const ready = nodes.find(n => n.req.every(r=>g.knownNodes[r]));
  const n = ready || nodes[0];
  return `${n.name} (${n.cost} knowledge)`;
}

function renderJobsTab(root){
  const g = G;
  const c = el("div","card");
  c.innerHTML = `<h3>🛠 Assign Jobs</h3><div class="muted">Buildings have worker slots. General jobs (woodcutter, gatherer, water carrier, scavenger) don't need a building.</div>`;
  const list = el("div");
  for (const s of adults(g)){
    if (s.isPlayer) continue;
    const cur = g.jobs[s.id] || "none";
    const item = el("div","item");
    let opts = "";
    for (const jk of JOB_KEYS){
      const j = JOBS[jk];
      const available = jobAvailable(g, jk) || jk===cur;
      if (j.building){
        if (!g.buildings[j.building]) continue;
      }
      opts += `<option value="${jk}" ${jk===cur?"selected":""} ${available?"":"disabled"}>${j.name}${j.building?" ("+BUILDINGS[j.building].name+")":""}</option>`;
    }
    item.innerHTML = `<div class="head"><span class="name">${s.name}</span> <span class="muted">${s.traits.map(t=>TRAITS[t].label).join(", ")}</span></div>
      <div class="desc">${JOBS[cur].desc}</div>`;
    const sel = el("select");
    sel.innerHTML = opts;
    sel.onchange = ()=> assignJob(s.id, sel.value);
    item.appendChild(sel);
    list.appendChild(item);
  }
  if (adults(g).length<=1){
    list.innerHTML = `<div class="muted">No other survivors yet. Explore to find some.</div>`;
  }
  c.appendChild(list);
  root.appendChild(c);

  // Building worker assignments
  const wc = el("div","card");
  wc.innerHTML = `<h3>🏠 Worker Slots</h3>`;
  for (const id in g.buildings){
    const b = BUILDINGS[id]; if (!b) continue;
    if (!b.workers) continue;
    const slots = b.workers * g.buildings[id].count;
    const used = (g.workerAssign[id]||[]).length;
    const item = el("div","item");
    item.innerHTML = `<div class="head"><span class="name">${b.icon} ${b.name}</span> <span class="meta">${used}/${slots} workers</span></div>
      <div class="desc">${(g.workerAssign[id]||[]).map(uid=>survivorById(g,uid)?.name).filter(Boolean).join(", ") || "(none)"}</div>`;
    wc.appendChild(item);
  }
  root.appendChild(wc);
}

function renderKnowledgeTab(root){
  const g = G;
  const c = el("div","card");
  c.innerHTML = `<h3>📚 Knowledge Tree</h3><div class="muted">Knowledge: <b>${Math.floor(g.knowledge*10)/10}</b>. Earn it by surviving, scavenging books, libraries, and schools.</div>`;
  const cats = {};
  for (const n of KNOWLEDGE){ if(!cats[n.cat]) cats[n.cat] = []; cats[n.cat].push(n); }
  for (const cat in cats){
    const wrap = el("div","kcat");
    wrap.innerHTML = `<h4>${cat}</h4>`;
    for (const n of cats[cat]){
      const have = !!g.knownNodes[n.id];
      const reqMet = n.req.every(r=>g.knownNodes[r]);
      const canBuy = reqMet && g.knowledge >= n.cost && !have;
      const cls = have ? "unlocked" : (canBuy?"available":"locked");
      const node = el("span","knode "+cls);
      const unlocks = (n.unlock?.buildings||[]).map(b=>BUILDINGS[b]?.name).filter(Boolean).join(", ");
      node.innerHTML = `${have?"✔ ":""}${n.name} <span class="muted">(${n.cost})</span>`;
      node.title = `${n.desc}${unlocks?"\nUnlocks: "+unlocks:""}${n.req.length?"\nRequires: "+n.req.map(r=>KNOWLEDGE.find(x=>x.id===r).name).join(", "):""}`;
      if (canBuy) node.onclick = ()=> research(n.id);
      wrap.appendChild(node);
    }
    c.appendChild(wrap);
  }
  root.appendChild(c);
}

function renderBuildingsTab(root){
  const g = G;
  const c = el("div","card");
  c.innerHTML = `<h3>🏠 Built Structures</h3>`;

  } else {

      item.innerHTML = `<div class="head"><span class="name">${b.icon} ${b.name}</span> <span class="meta">x${g.buildings[id].count}</span></div>
        <div class="desc">${b.desc}</div>
